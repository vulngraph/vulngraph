    title: "S3 bucket policies restrict other accounts"
    service: s3
    status: covered
    check_ids: [aws-s3-policy-cross-account-write]
    reason: "Allow of s3:DeleteBucketPolicy/PutBucketAcl/PutBucketPolicy/PutEncryptionConfiguration/PutObjectAcl to another account ID, or to everyone (Principal \"*\", or an Allow with NotPrincipal) without a condition that restricts the caller."
    severity: high
