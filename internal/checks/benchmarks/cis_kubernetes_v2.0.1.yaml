  - id: "5.2.1"
    title: "Cluster enforces at least one pod admission policy"
    service: pod-security
    status: covered
    check_ids: [k8s-namespace-no-pod-security-enforcement]
    reason: "Active non-system namespaces without a baseline/restricted pod-security.kubernetes.io/enforce label and without proven enforcement by an external policy system: a Kyverno podSecurity rule in Enforce, or a Gatekeeper pod-security-library constraint in deny, matching Pods there (read through the chart's list-only ClusterRole). An installed engine without that proof, or with unreadable policies, is reported at Info; an explicit privileged label always at Low. ValidatingAdmissionPolicies are not counted: CEL cannot be tied to pod security reliably."
    severity: high
  - id: "5.2.2"
    title: "Admission policy blocks privileged containers"
    service: pod-security
    status: covered
    check_ids: [k8s-privileged-container, k8s-namespace-no-pod-security-enforcement]
    reason: "Evaluated as the benchmark audit does: every running or pending pod, outside system namespaces (platform workloads, not the user workloads the control scopes to), collapsed to its owning workload. A namespace explicitly labelled pod-security.kubernetes.io/enforce=privileged, where the pod checks stand down, is reported by k8s-namespace-no-pod-security-enforcement instead, so every user namespace is graded either pod by pod or on its admission policy."
    severity: critical
