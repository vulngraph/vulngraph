    title: Pods and containers set a securityContext
    service: general
    status: partial
    check_ids: [k8s-container-runs-as-root, k8s-container-allow-privilege-escalation, k8s-privileged-container, k8s-dangerous-capabilities, k8s-container-added-capabilities, k8s-container-net-raw, k8s-pod-seccomp-unrestricted, k8s-pod-apparmor-unconfined, k8s-container-writable-root-fs]
    reason: "Root, privilege escalation, privileged, capabilities (added, dangerous, NET_RAW), seccomp, explicit AppArmor Unconfined and readOnlyRootFilesystem are evaluated; runAsGroup and SELinux options are not."
    severity: medium
  - id: "5.6.4"
    title: "Do not deploy workloads to the default namespace"
