# Scan domain (internal/app/scan). Scan runs; triggering is admin-only and async.
components:
  pathItems:
    scans:
      get:
        operationId: listScans
        tags: [scans]
        summary: List recent scan runs
        responses:
          '200':
            description: Scan runs.
            content:
              application/json:
                schema:
                  type: array
                  items: { $ref: '#/components/schemas/ScanRun' }
          '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
      post:
        operationId: triggerScan
        tags: [scans]
        summary: Enqueue a scan (admin only)
        responses:
          '204': { description: Scan enqueued. }
          '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
          '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }

    getScan:
      get:
        operationId: getScan
        tags: [scans]
        summary: Get one scan run with targets, template tags, and scanner info
        parameters: [ { $ref: '../openapi.yaml#/components/parameters/IdPath' } ]
        responses:
          '200':
            description: The scan run.
            content:
              application/json:
                schema: { $ref: '#/components/schemas/ScanRun' }
          '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
          '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
      delete:
        operationId: cancelScan
        tags: [scans]
        summary: Mark a scan run cancelled (admin only; does not stop an in-flight nuclei execution)
        description: >-
          Sets the scan_runs row to cancelled if it is still running. It does not
          cancel the River job or nuclei: a scan already probing its targets runs
          to completion, and its final status then replaces cancelled. An unknown
          or already-finished id is a no-op and still returns 204.
        parameters: [ { $ref: '../openapi.yaml#/components/parameters/IdPath' } ]
        responses:
          '204': { description: Run marked cancelled (or already not running). }
          '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
          '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }

    getScanFindings:
      get:
        operationId: getScanFindings
        tags: [scans]
        summary: Findings produced by a specific scan run (time-range query on source=nuclei)
        parameters: [ { $ref: '../openapi.yaml#/components/parameters/IdPath' } ]
        responses:
          '200':
            description: Findings from the scan
            content:
              application/json:
                schema: { $ref: '#/components/schemas/ScanRunFindings' }
          '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
          '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }

    validateTemplate:
      post:
        operationId: validateTemplate
        tags: [scans]
        summary: Lint a nuclei YAML template without executing it (admin only)
        description: >-
          Accepts http (and the deprecated requests key), dns, network (and tcp), ssl,
          websocket, whois and javascript templates; nuclei loads a javascript template
          only when it is signed by a trusted key. file, code, headless and workflow
          templates are refused by name. info.protocols lists every protocol block found.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [yaml]
                properties:
                  yaml: { type: string, description: Nuclei template YAML }
        responses:
          '200':
            description: Validation result
            content:
              application/json:
                schema: { $ref: '#/components/schemas/TemplateValidation' }
          '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
          '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }

    testTemplate:
      post:
        operationId: testTemplate
        tags: [scans]
        summary: Run a nuclei template against one URL (admin only)
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [yaml, target]
                properties:
                  yaml:   { type: string }
                  target: { type: string, format: uri }
        responses:
          '200': { description: Test results }
          '400':
            $ref: '../openapi.yaml#/components/responses/BadRequest'
            description: >
              Bad input (an undecodable body, missing yaml or target, a non-http(s)
              target), a target host that cannot be resolved, or a refused
              target: one that resolves to a private or loopback address (unless
              SCAN_ALLOW_INTERNAL_TARGETS=true), or to link-local or cloud metadata
              space (always refused).
          '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
          '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
          '422': { description: Template validation failed }

    generateTemplate:
      post:
        operationId: generateTemplate
        tags: [scans]
        summary: AI-generate a nuclei template from a natural-language description (admin only; LLM budget per user)
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [description]
                properties:
                  description: { type: string }
        responses:
          '200':
            description: Generated YAML, validation result, and attempt count
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    yaml:       { type: string }
                    validation: { $ref: '#/components/schemas/TemplateValidation' }
                    attempts:
                      type: integer
                      description: "Number of LLM calls made. >1 means the model self-corrected."
          '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
          '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
          '429': { $ref: '../openapi.yaml#/components/responses/TooManyRequests' }

    scanProfiles:
      get:
        operationId: listScanProfiles
        tags: [scans]
        summary: List scan profiles
        responses:
          '200':
            description: Scan profiles.
            content:
              application/json:
                schema:
                  type: array
                  items: { $ref: '#/components/schemas/ScanProfile' }
          '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
      post:
        operationId: createScanProfile
        tags: [scans]
        summary: Create a scan profile (admin only)
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanProfileRequest' }
        responses:
          '201':
            description: Created scan profile.
            content:
              application/json:
                schema: { $ref: '#/components/schemas/ScanProfile' }
          '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
          '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
          '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
          '422': { $ref: '../openapi.yaml#/components/responses/UnprocessableEntity' }

    scanProfile:
      get:
        operationId: getScanProfile
        tags: [scans]
        summary: Get a scan profile
        parameters: [ { $ref: '../openapi.yaml#/components/parameters/IdPath' } ]
        responses:
          '200':
            description: The scan profile.
            content:
              application/json:
                schema: { $ref: '#/components/schemas/ScanProfile' }
          '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
          '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
      put:
        operationId: updateScanProfile
        tags: [scans]
        summary: Update a scan profile (admin only)
        parameters: [ { $ref: '../openapi.yaml#/components/parameters/IdPath' } ]
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanProfileRequest' }
        responses:
          '200':
            description: Updated scan profile.
            content:
              application/json:
                schema: { $ref: '#/components/schemas/ScanProfile' }
          '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
          '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
          '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
          '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
          '422': { $ref: '../openapi.yaml#/components/responses/UnprocessableEntity' }
      delete:
        operationId: deleteScanProfile
        tags: [scans]
        summary: Delete a scan profile (admin only)
        parameters: [ { $ref: '../openapi.yaml#/components/parameters/IdPath' } ]
        responses:
          '204': { description: Deleted. }
          '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
          '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
          '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }

    triggerScanProfile:
      post:
        operationId: triggerScanProfile
        tags: [scans]
        summary: Immediately enqueue a scan run for a profile (admin only)
        parameters: [ { $ref: '../openapi.yaml#/components/parameters/IdPath' } ]
        responses:
          '204': { description: Scan enqueued. }
          '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
          '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
          '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }

    importFindings:
      post:
        operationId: importFindings
        tags: [scans]
        summary: Bulk-import findings from an external scanner (admin only)
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportRequest' }
        responses:
          '201':
            description: Findings imported as a completed scan run.
            content:
              application/json:
                schema: { $ref: '#/components/schemas/ImportResponse' }
          '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
          '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
          '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }

    workflowPresets:
      get:
        operationId: listWorkflowPresets
        tags: [scans]
        summary: Pre-built target and trigger presets for the workflow builder (no auth — static catalog)
        security: []
        responses:
          '200':
            description: The preset catalog.
            content:
              application/json:
                schema: { $ref: '#/components/schemas/WorkflowPresets' }

  schemas:
    WorkflowPresets:
      type: object
      required: [targets, triggers]
      properties:
        targets:
          type: array
          items:
            type: object
            required: [id, label, description, query]
            properties:
              id: { type: string }
              label: { type: string }
              description: { type: string }
              query: { type: string, description: Cypher that pre-fills the WHO editor. }
        triggers:
          type: array
          items:
            type: object
            required: [id, label, description, schedule, drift_enabled]
            properties:
              id: { type: string }
              label: { type: string }
              description: { type: string }
              schedule: { type: string, description: Cron expression; empty = no schedule. }
              drift_enabled: { type: boolean, description: "True = scan on a change to an internet-exposed asset (profiles with an empty target_query only)." }
    ScanStatus:
      type: string
      enum: [running, completed, failed, cancelled]
    ScanRun:
      type: object
      required: [id, status, target_count, finding_count, started_at]
      properties:
        id:             { type: string }
        status:         { $ref: '#/components/schemas/ScanStatus' }
        target_count:   { type: integer }
        target_urls:    { type: array, items: { type: string }, description: Actual URLs/IPs scanned }
        finding_count:  { type: integer }
        template_tags:  { type: array, items: { type: string }, description: Nuclei template tags selected }
        template_count: { type: integer, description: Distinct templates that fired }
        scanner_name:   { type: string }
        error:          { type: string }
        started_at:     { type: string, format: date-time }
        finished_at:    { type: string, format: date-time }

    TemplateInfo:
      type: object
      properties:
        id:          { type: string }
        name:        { type: string }
        author:      { type: string }
        severity:    { type: string, enum: [info, low, medium, high, critical] }
        description: { type: string }
        tags:        { type: array, items: { type: string } }
        protocols:   { type: array, items: { type: string } }

    TemplateValidationError:
      type: object
      properties:
        line:    { type: integer }
        message: { type: string }

    TemplateValidation:
      type: object
      required: [valid]
      properties:
        valid:  { type: boolean }
        info:   { $ref: '#/components/schemas/TemplateInfo' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/TemplateValidationError' }

    TemplateStrategy:
      type: string
      description: >-
        How a profile run picks nuclei templates. all = the scanner's default
        selection by asset type (medium+ severity), not every template;
        tags = the profile's template_tags, minus the scanner's excluded tags
        (fuzzing, intrusive, dos, windows, iis, sharepoint, lotus), and a run
        fails when every tag is excluded. The credential-attempt tags
        (default-login, brute-force, bruteforce) are excluded from both
        strategies unless template_tags names them; ai_contextual is not available:
        create and update reject it with 400, and a stored profile with it
        fails every run.
      enum: [all, tags, ai_contextual]

    ScanProfile:
      type: object
      required: [id, name, scanner_type, template_strategy, enabled, created_at, updated_at]
      properties:
        id:                { type: string }
        name:              { type: string }
        description:       { type: string }
        target_query:      { type: string, description: "Asset filter expression used to build the scan target list" }
        scanner_type:      { type: string, description: "Scanner backend identifier (e.g. nuclei)" }
        template_strategy: { $ref: '#/components/schemas/TemplateStrategy' }
        template_tags:
          type: array
          items: { type: string }
          description: "Template tags to include when strategy is 'tags'"
        schedule:          { type: string, description: Cron expression for automatic scheduling (optional) }
        schedule_error:    { type: string, description: "Set when the stored schedule is not a valid 5-field cron expression (saved before schedules were validated): the profile never runs on a schedule until it is fixed. Absent when the schedule is valid or empty." }
        drift_enabled:     { type: boolean, description: "Trigger a scan automatically when a connector sync reports a change to an internet-exposed asset. Applies only to a profile with an empty target_query: a scoped profile is never drift-triggered." }
        enabled:           { type: boolean }
        created_at:        { type: string, format: date-time }
        updated_at:        { type: string, format: date-time }

    ScanProfileRequest:
      type: object
      required: [name, scanner_type, template_strategy]
      properties:
        name:              { type: string }
        description:       { type: string }
        target_query:      { type: string }
        scanner_type:      { type: string }
        template_strategy: { $ref: '#/components/schemas/TemplateStrategy' }
        template_tags:
          type: array
          items: { type: string }
        schedule:          { type: string }
        drift_enabled:     { type: boolean }
        enabled:           { type: boolean, default: true }

    ImportFinding:
      type: object
      properties:
        check_id:    { type: string }
        title:       { type: string }
        severity:    { type: string }
        description: { type: string }
        reference:   { type: string, description: "URL or advisory identifier (CVE, NVD, vendor bulletin)" }
        matched_at:  { type: string, description: "URL or location where the issue was observed" }

    ScanRunFindings:
      type: object
      required: [scan_id, findings, count]
      properties:
        scan_id: { type: string }
        count:   { type: integer }
        findings:
          type: array
          items: { $ref: '#/components/schemas/ScanRunFinding' }

    ScanRunFinding:
      type: object
      required: [id, severity, score, score_band, title, resource_id, resource_type, check_id, detected_at]
      properties:
        id:            { type: string }
        severity:      { type: string }
        score:         { type: integer, minimum: 0, maximum: 100 }
        score_band:    { $ref: './finding.yaml#/components/schemas/ScoreBand' }
        title:         { type: string }
        resource_id:   { type: string }
        resource_type: { type: string }
        check_id:      { type: string }
        detected_at:   { type: string, format: date-time }

    ImportRequest:
      type: object
      required: [source, findings]
      properties:
        source:
          type: string
          enum: [openvas, qualys, burp, custom]
          description: "External scanner the findings came from"
        source_ref: { type: string, description: "Scan ID in the external system, stored for traceability" }
        asset_id:   { type: string, description: "Graph asset the import is attributed to; takes precedence over asset_ip" }
        asset_ip:   { type: string, description: "Public IP used for best-effort asset attribution when asset_id is not known" }
        findings:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ImportFinding' }

    ImportResponse:
      type: object
      required: [scan_id, finding_count]
      properties:
        scan_id:       { type: string }
        finding_count: { type: integer }
