name: Performance trends

on:
  schedule:
    - cron: "41 4 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-trends
  cancel-in-progress: false

jobs:
  repeated:
    name: Repeated pipeline (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.11"
          cache: true
      - name: Fetch pinned LadybugDB
        run: scripts/fetch-ladybug.sh
      - name: Repeat on fresh databases
        env:
          PERF_CONNECTOR_MAX: "1000"
          PERF_SOAK_SECONDS: "300"
          PERF_CH_MEMORY: 3g
          PERF_CH_CPUS: "2"
          GOMAXPROCS: "4"
        run: |
          for run in 1 2 3; do
            scripts/benchmark-connectors.sh "$RUNNER_TEMP/performance-trends/run-$run"
          done
          python3 scripts/performance_trend.py summarize "$RUNNER_TEMP/performance-trends"/run-* > "$RUNNER_TEMP/performance-trends/summary.json"
      - name: Repeat larger versioned query fixtures
        env:
          PERF_QUERY_EXPERIMENT: buffers
          PERF_QUERY_VERSIONS: "3"
          PERF_CH_MEMORY: 3g
          PERF_CH_CPUS: "2"
          GOMAXPROCS: "4"
        run: |
          for run in 1 2 3; do
            scripts/benchmark-queries.sh target "$RUNNER_TEMP/performance-trends/queries-$run"
          done
      - name: Upload comparable samples and failure logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-trends-${{ matrix.arch }}
          path: ${{ runner.temp }}/performance-trends/
          retention-days: 90
