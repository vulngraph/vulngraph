name: Pipeline throughput

on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: smoke
  workflow_dispatch:
    inputs:
      profile:
        description: Dataset size (large profiles require a suitably sized local machine)
        type: choice
        default: medium
        options: [smoke, medium]

permissions:
  contents: read

concurrency:
  group: pipeline-throughput-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    name: Real pipeline contracts and costs (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.11"
          cache: true
      - name: Fetch pinned LadybugDB
        run: scripts/fetch-ladybug.sh
      - name: Test Go and native binding on ARM64
        if: matrix.arch == 'arm64'
        env:
          GOMAXPROCS: "4"
        run: |
          test "$(uname -m)" = aarch64
          test "$(go env GOARCH)" = arm64
          go test ./... -count=1
          go -C internal/graphdb/ladybug test ./... -count=1
      - name: Validate benchmark code
        run: |
          go vet -tags=integration ./internal/perfassurance ./cmd/perf-inventory ./internal/throughput ./internal/jobs ./internal/app/asset ./internal/app/finding ./internal/app/enrich ./internal/app/correlate ./internal/app/connector ./internal/migrate ./migrations/...
          python3 -m unittest discover -s scripts -p performance_trend_test.py
          python3 -m unittest discover -s scripts -p run_bounded_test.py
      - name: Measure connector API fixtures
        env:
          PERF_CONNECTORS: "1"
          PERF_CONNECTOR_MAX: ${{ github.event_name == 'workflow_dispatch' && '10000' || '1000' }}
          PERF_CONNECTOR_DIR: ${{ runner.temp }}/connector-throughput
          GOMAXPROCS: "4"
        run: |
          mkdir -p "$PERF_CONNECTOR_DIR"
          go test -p 1 ./internal/collect/... -run '^TestConnectorScale$' -count=1 -timeout=15m -v 2>&1 | tee "$PERF_CONNECTOR_DIR/collect.log"
      - name: Replay GitHub workflow relationships in native graph
        env:
          GITHUB_VISIBILITY_FIXTURES: ${{ runner.temp }}/connector-throughput
          PERF_CONNECTOR_MAX: ${{ github.event_name == 'workflow_dispatch' && '10000' || '1000' }}
          GOMAXPROCS: "4"
        run: go test ./internal/app/graphstore -run '^TestGitHubVisibilityFixtureReplay$' -count=1 -timeout=10m -v 2>&1 | tee "$GITHUB_VISIBILITY_FIXTURES/graph-replay.log"
      - name: Reconcile workload inventory
        run: go run ./cmd/perf-inventory -check
      - name: Check inventory and dashboard query budgets
        timeout-minutes: 15
        env:
          PERF_CH_MEMORY: 3g
          PERF_CH_CPUS: "2"
          GOMAXPROCS: "4"
        run: scripts/benchmark-queries.sh smoke "$RUNNER_TEMP/query-throughput"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.19.0
      - name: Check latest-row joins and lifecycle parity
        timeout-minutes: 15
        env:
          PERF_JOIN_EXPERIMENT: latest_rows
          GOMAXPROCS: "4"
        run: |
          scripts/benchmark-large-joins.sh smoke "$RUNNER_TEMP/large-join-throughput/smoke"
          scripts/benchmark-large-joins.sh target "$RUNNER_TEMP/large-join-throughput/target"
      - name: Check derived-state publication and lifecycle
        timeout-minutes: 15
        env:
          PERF_ENVELOPE_TEST: '^TestEnvelopeDerived(State|AtomicPublication|Retention|SnapshotBarrier|UpgradeAndReappearance)$'
          GOMAXPROCS: "4"
        run: |
          PERF_LINUX_GO_CACHE="$(go env GOCACHE)"
          export PERF_LINUX_GO_CACHE
          bash scripts/benchmark-connector-envelope.sh smoke "$RUNNER_TEMP/derived-throughput"
      - name: Run isolated pipeline
        env:
          PERF_PROFILE_INPUT: ${{ inputs.profile }}
          PERF_CH_MEMORY: 3g
          PERF_CH_CPUS: "2"
          PERF_SOAK_SECONDS: "60"
          PERF_CONNECTOR_MAX: ${{ github.event_name == 'workflow_dispatch' && '10000' || '1000' }}
          PERF_CONNECTOR_DIR: ${{ runner.temp }}/connector-throughput
        run: scripts/benchmark-pipeline.sh "$PERF_PROFILE_INPUT" "$RUNNER_TEMP/pipeline-throughput"
      - name: Upload measurements and failure logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-throughput-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/query-throughput/
            ${{ runner.temp }}/large-join-throughput/
            ${{ runner.temp }}/pipeline-throughput/
            ${{ runner.temp }}/connector-throughput/
            ${{ runner.temp }}/derived-throughput/
            !${{ runner.temp }}/derived-throughput/envelope.test
          retention-days: 14
