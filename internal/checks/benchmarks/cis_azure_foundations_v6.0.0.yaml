benchmark: cis-azure-foundations
name: CIS Microsoft Azure Foundations Benchmark
version: "6.0.0"
family: cis
providers: [azure]
source: https://www.cisecurity.org/benchmark/azure
controls:
  # ── 2 Analytics: Azure Databricks ────────────────────────────────────────
  - id: "2.1.1"
    title: Databricks workspace uses a customer-managed VNet
    service: databricks
    status: covered
    check_ids: [azure-databricks-no-vnet-injection]
    reason: "Reads parameters.customVirtualNetworkId from the Databricks workspace list; fires when the parameters block is returned without one."
    severity: medium
  - id: "2.1.2"
    title: Databricks subnets have network security groups
    service: databricks
    status: covered
    check_ids: [azure-databricks-subnet-no-nsg]
    reason: "Joins a VNet-injected workspace's customPublicSubnetName/customPrivateSubnetName to this sweep's subnet assets (nsg_id from the VNet list); fires naming the subnets with no NSG. Unknown when either subnet is not in the sweep. Workspaces in a Databricks-managed VNet are out of scope (Databricks owns those NSGs)."
    severity: medium
  - id: "2.1.3"
    title: Databricks inter-worker traffic is encrypted
    service: databricks
    status: manual
    reason: Configured through cluster init scripts / cluster policies inside the workspace; needs Databricks data-plane REST access and human review of scripts.
    severity: low
  - id: "2.1.4"
    title: Databricks identities sync from Entra ID
    service: databricks
    status: manual
    reason: SCIM provisioning lives in the Databricks account console and Entra enterprise apps; no ARM API reports it.
    severity: low
  - id: "2.1.5"
    title: Databricks uses Unity Catalog
    service: databricks
    status: manual
    reason: Metastore assignment is only visible through the Databricks account REST API, not ARM; governance fit needs review.
    severity: low
  - id: "2.1.6"
    title: Databricks personal access tokens are restricted and expire
    service: databricks
    status: missing
    reason: "Needs the Databricks workspace REST API (workspace-conf maxTokenLifetimeDays, token permissions), which takes a workspace-admin Databricks token: Azure Reader on the workspace resource does not grant it, and the ARM resource does not expose these settings."
    severity: medium
  - id: "2.1.7"
    title: Databricks diagnostic log delivery configured
    service: databricks
    status: missing
    reason: "Needs Microsoft.Insights/diagnosticSettings on each Databricks workspace resource. Workspaces are now collected (azure_databricks_workspace); per-resource diagnostic settings belong to the Azure Monitor collector (6.1.4), which is not built yet."
    severity: medium
  - id: "2.1.8"
    title: Databricks critical data encrypted with customer keys
    service: databricks
    status: covered
    check_ids: [azure-databricks-no-cmk]
    reason: "Fires when none of managed services, managed disks (properties.encryption.entities keySource Microsoft.Keyvault) or the DBFS root (parameters.encryption) uses a customer-managed key. Graded Info: Microsoft-managed keys already encrypt the data."
    severity: low
  - id: "2.1.9"
    title: Databricks clusters have no public IPs
    service: databricks
    status: covered
    check_ids: [azure-databricks-public-ip]
    reason: "Reads parameters.enableNoPublicIp. Its default changed by API version, so an unset value stays unknown."
    severity: medium
  - id: "2.1.10"
    title: Databricks public network access disabled
    service: databricks
    status: covered
    check_ids: [azure-databricks-public-network-access]
    reason: "Reads properties.publicNetworkAccess (unset is Enabled)."
    severity: high
  - id: "2.1.11"
    title: Databricks reached through private endpoints
    service: databricks
    status: covered
    check_ids: [azure-databricks-no-private-endpoint]
    reason: "Counts approved privateEndpointConnections on the workspace; fires on zero."
    severity: medium
  - id: "2.1.12"
    title: Review Databricks groups periodically
    service: databricks
    status: manual
    reason: A periodic membership review process; no API can attest that a review happened.
    severity: low
  # ── 3 Compute ────────────────────────────────────────────────────────────
  - id: "3.1.1"
    title: Only MFA identities reach privileged VMs
    service: compute
    status: covered
    check_ids: [azure-vm-admin-without-mfa]
    reason: "Users (principalType User) holding Owner, Contributor, Virtual Machine Contributor or Virtual Machine Administrator Login at a scope that reaches a collected VM (subscription or above, its resource group, or the VM) whose Graph authentication-methods registration row says isMfaCapable false; one finding on the subscription. Disabled users and users missing from the report are not counted. Group assignments are not expanded (membership needs GroupMember.Read.All), so a user reaching a VM role only through a group is not reported."
    severity: high
  # ── 5 Identity ───────────────────────────────────────────────────────────
  - id: "5.1.1"
    title: Entra security defaults enabled
    service: entra-id
    status: covered
    check_ids: [azure-entra-no-mfa-baseline]
    reason: "Fires on the tenant settings asset when Graph identitySecurityDefaultsEnforcementPolicy.isEnabled is false AND the enabled Conditional Access policies lack either MFA for all users on all apps or a legacy-authentication block (CIS defers to Conditional Access when it is used). A policy counts only if it is enabled (not report-only), covers all apps, requires MFA outright (the mfa control or an authentication strength, alone or with operator AND; MFA OR a compliant device does not count), is not narrowed to a platform, location, client app, device filter or risk level, and excludes nothing but at most two individual users (Microsoft's break-glass pattern; excluded groups, roles, guests or apps disqualify it). High when any role in Microsoft's admin-MFA template (Global Administrator, Privileged Role Administrator, Security Administrator and 12 more) is left uncovered, Medium otherwise."
    severity: high
  - id: "5.1.2"
    title: MFA required to join or register devices
    service: entra-id
    status: covered
    check_ids: [azure-entra-device-join-no-mfa]
    reason: "Graph policies/deviceRegistrationPolicy multiFactorAuthConfiguration notRequired AND no enabled Conditional Access policy requiring MFA on the urn:user:registerdevice user action (Microsoft's recommended replacement)."
    severity: medium
  - id: "5.1.3"
    title: MFA enabled for every user
    service: entra-id
    status: covered
    check_ids: [azure-entra-users-without-mfa]
    reason: "Graph reports/authenticationMethods/userRegistrationDetails: enabled (users accountEnabled eq false excluded) member users with isMfaCapable false; one tenant finding with the count and a sample, High when an admin is among them. Guests are excluded: they authenticate in their home tenant."
    severity: critical
  - id: "5.1.4"
    title: Trusted-device MFA remembering disabled
    service: entra-id
    status: manual
    reason: Set in the legacy per-user MFA service settings portal, which has no supported Graph or ARM read API.
    severity: low
  - id: "5.3.1"
    title: Admin accounts not used day to day
    service: entra-id
    status: manual
    reason: Whether an admin account is used for daily work is an organisational practice; sign-in logs can hint but cannot attest it.
    severity: medium
  - id: "5.3.2"
    title: Review guest users regularly
    service: entra-id
    status: manual
    reason: A periodic review process; Graph users?$filter=userType eq 'Guest' can list guests but not prove a review.
    severity: medium
  - id: "5.3.3"
    title: Restrict User Access Administrator assignments
    service: rbac
    status: covered
    check_ids: [azure-root-user-access-admin]
    reason: "Fires on the subscription when User Access Administrator is assigned at the root scope \"/\" (standing elevated access). Read from the unfiltered ListForSubscription role-assignment listing, which returns assignments at, above and below the subscription."
    severity: high
  - id: "5.3.4"
    title: Review privileged role assignments periodically
    service: rbac
    status: manual
    reason: A periodic review process; role assignments can be listed but a review cannot be attested by API.
    severity: medium
  - id: "5.3.5"
    title: Disabled users hold no resource permissions
    service: rbac
    status: covered
    check_ids: [azure-disabled-user-has-role]
    reason: "Graph users with accountEnabled false joined to the unfiltered subscription role-assignment listing (assignments at, above and below the subscription, principalType User); one finding on the subscription listing user and role. Group membership is not expanded."
    severity: medium
  - id: "5.3.6"
    title: Review Tenant Creator role assignments
    service: entra-id
    status: manual
    reason: A periodic review process over an Entra directory role; not attestable by API.
    severity: low
  - id: "5.3.7"
    title: Review non-privileged role assignments periodically
    service: rbac
    status: manual
    reason: A periodic review process; not attestable by API.
    severity: low
  - id: "5.4"
    title: No custom subscription-owner roles exist
    service: rbac
    status: covered
    check_ids: [azure-custom-owner-role]
    reason: "Fires on the subscription when a CustomRole definition has Actions \"*\" and an assignable scope of \"/\", a management group, or the subscription itself. Role Definitions - List at the subscription scope returns every definition \"applicable at scope and above\", so custom roles defined at an ancestor management group are included."
    severity: high
  - id: "5.5"
    title: Custom role exists for administering resource locks
    service: rbac
    status: manual
    reason: Whether lock administration is delegated through a dedicated role is an organisational design choice.
    severity: low
  - id: "5.6"
    title: Block subscriptions moving between Entra tenants
    service: subscription
    status: covered
    check_ids: [azure-subscription-tenant-transfer-allowed]
    reason: "Microsoft.Subscription/policies/default (GetPolicyForTenant): blockSubscriptionsLeavingTenant or blockSubscriptionsIntoTenant not true (unset is the documented default, not blocked); one finding on the tenant settings asset."
    severity: medium
  - id: "5.7"
    title: Subscription has two or three owners
    service: rbac
    status: covered
    check_ids: [azure-subscription-owner-count]
    reason: "Counts distinct principals (users, groups, service principals) with an active Owner assignment at the subscription or an ancestor scope; fires outside 2..3. A group counts as one principal (membership needs Microsoft Graph); orphaned assignments to deleted principals are counted (ARM cannot tell them apart without Graph); PIM-eligible (not yet activated) owners are not listed by roleAssignments and are not counted."
    severity: medium
  # ── 6 Management and Governance ──────────────────────────────────────────
  - id: "6.1.1.1"
    title: Subscription activity log has a diagnostic setting
    service: monitor
    status: covered
    check_ids: [azure-activity-log-not-exported]
    reason: "Microsoft.Insights/diagnosticSettings at the subscription scope: no setting with a destination and at least one enabled log category."
    severity: high
  - id: "6.1.1.2"
    title: Activity log diagnostic setting captures needed categories
    service: monitor
    status: covered
    check_ids: [azure-activity-log-categories-missing]
    reason: "Union of enabled categories across exporting subscription diagnostic settings lacks Administrative, Alert, Policy or Security (the allLogs category group satisfies all). Asked only when a setting exists."
    severity: medium
  - id: "6.1.1.3"
    title: Activity log storage account uses customer keys
    service: monitor
    status: covered
    check_ids: [azure-activity-log-storage-no-cmk]
    reason: "Each storage account receiving the activity log (diagnostic setting storageAccountId) read with Storage GetProperties; fires when encryption.keySource is not Microsoft.Keyvault."
    severity: low
  - id: "6.1.1.4"
    title: Key Vault diagnostic logging enabled
    service: monitor
    status: covered
    check_ids: [azure-keyvault-audit-logging-off]
    reason: "Per-vault Microsoft.Insights/diagnosticSettings: no exporting setting enables the AuditEvent category or the audit/allLogs category group."
    severity: medium
  - id: "6.1.1.5"
    title: NSG flow logs sent to Log Analytics
    service: monitor
    status: covered
    check_ids: [azure-nsg-flow-logs-not-analysed, azure-vnet-flow-logs-not-analysed]
    reason: "Reads every Network Watcher's flow logs (networkWatchers/flowLogs list) onto their target NSG: fires on an enabled NSG flow log without traffic analytics into a Log Analytics workspace. Azure stopped accepting new NSG flow logs on 30 June 2025, so an NSG without one is not asked to create it; its traffic is covered by the VNet flow log check (6.1.1.6). Unknown when any watcher's flow-log listing fails."
    severity: low
  - id: "6.1.1.6"
    title: VNet flow logs sent to Log Analytics
    service: monitor
    status: covered
    check_ids: [azure-vnet-flow-logs-not-analysed]
    reason: "Fires on a VNet with no enabled VNet-scoped flow log, or one without traffic analytics into a Log Analytics workspace (one finding, title says which). A VNet counts as logged only through a flow log targeting the VNet itself, the unit the benchmark audits; subnet- or NIC-scoped logs do not satisfy it. Unknown when any watcher's flow-log listing fails."
    severity: medium
  - id: "6.1.1.7"
    title: Microsoft Graph activity logs exported
    service: monitor
    status: covered
    check_ids: [azure-entra-logs-not-exported]
    reason: "ARM microsoft.aadiam/diagnosticSettings (tenant scope): MicrosoftGraphActivityLogs not exported, asked when the tenant holds Entra ID P1/P2 (Graph subscribedSkus), which the category requires. Same finding as 6.1.1.8."
    severity: low
  - id: "6.1.1.8"
    title: Entra activity logs exported
    service: monitor
    status: covered
    check_ids: [azure-entra-logs-not-exported]
    reason: "ARM microsoft.aadiam/diagnosticSettings (tenant scope): AuditLogs not exported to any destination, or SignInLogs not exported on a P1/P2 tenant (free tenants cannot export sign-in logs). One finding lists the missing categories."
    severity: medium
  - id: "6.1.1.9"
    title: Intune logs exported to Log Analytics
    service: monitor
    status: covered
    check_ids: [azure-intune-logs-not-exported]
    reason: "ARM Microsoft.Intune/diagnosticSettings (tenant scope): AuditLogs, OperationalLogs, DeviceComplianceOrg and Devices not all sent to a Log Analytics workspace. Asked only when the tenant holds an Intune licence (Graph subscribedSkus service plan INTUNE_A, INTUNE_A_VL, INTUNE_A_GOV, INTUNE_EDU or INTUNE_SMBIZ)."
    severity: low
  - id: "6.1.2.1"
    title: Alert on policy assignment creation
    service: monitor
    status: covered
    check_ids: [azure-activity-log-alerts-missing]
    reason: "Microsoft.Insights/activityLogAlerts: no enabled alert scoped to the subscription matching this control's operationName (equals, containsAny or anyOf) with a category that carries the event or no category filter: Administrative for every operation, and Security too for the security-solution operations (the category CIS's remediation uses); an alert on a whole accepted category also counts, or for 6.1.2.11 the ServiceHealth category. Alerts narrowed by resourceGroup, resourceId or caller do not count. One finding lists every missing alert."
    severity: low
  - id: "6.1.2.2"
    title: Alert on policy assignment deletion
    service: monitor
    status: covered
    check_ids: [azure-activity-log-alerts-missing]
    reason: "Microsoft.Insights/activityLogAlerts: no enabled alert scoped to the subscription matching this control's operationName (equals, containsAny or anyOf) with a category that carries the event or no category filter: Administrative for every operation, and Security too for the security-solution operations (the category CIS's remediation uses); an alert on a whole accepted category also counts, or for 6.1.2.11 the ServiceHealth category. Alerts narrowed by resourceGroup, resourceId or caller do not count. One finding lists every missing alert."
    severity: low
  - id: "6.1.2.3"
    title: Alert on NSG create or update
    service: monitor
    status: covered
