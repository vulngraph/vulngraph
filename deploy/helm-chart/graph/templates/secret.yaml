{{- if .Values.secret.create }}
# graph-secrets — rendered by the chart from .Values.secret.*. Supply those at
# install time (--set-string, an untracked values file, or your secret manager /
# CD tooling) so real values never live in git. For in-cluster datastores the
# DSNs are built from the passwords below; for external datastores
# (postgres/clickhouse disabled) set secret.databaseUrl / secret.clickhouseUrl
# instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  labels:
    {{- include "graph.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- include "graph.checkSecretKey" (dict "name" "secret.secretKey" "key" (required "secret.secretKey is required" .Values.secret.secretKey)) }}
  secret-key: {{ .Values.secret.secretKey | quote }}
  {{- with .Values.secret.retiredSecretKeys }}
  {{- range $i, $k := splitList "," . }}
  {{- with trim $k }}
  {{- include "graph.checkSecretKey" (dict "name" (printf "secret.retiredSecretKeys entry %d" (add1 $i)) "key" .) }}
  {{- end }}
  {{- end }}
  # Read-only keys during a GRAPH_SECRET_KEY rotation; remove once
  # `graph keys rewrap` has re-sealed every row.
  retired-secret-keys: {{ . | quote }}
  {{- end }}
  # LLM provider API key — optional (LLM features are off without one; a local
  # keyless server needs only llm.baseURL). secret.anthropicApiKey is accepted
  # for back-compat.
  llm-api-key: {{ default .Values.secret.anthropicApiKey .Values.secret.llmApiKey | quote }}
  # Shared secret authenticating the serve→worker Ladybug RPC (:8090). The worker
  # refuses to serve an unauthenticated RPC (LADYBUG_RPC_INSECURE is a local-dev
  # escape hatch only), so this must always have a value.
  #
  # It must not default to secretKey ITSELF: the RPC bearer token would then BE
  # the key encrypting every connector credential, and anything that could read
  # an RPC secret — a config dump, a log line, a client that holds it to make
  # calls — would hold the credential key.
  #
  # So it defaults to a value DERIVED from secretKey instead. That keeps the
  # "authenticated out of the box, no extra secret to provision" property, while making the RPC secret a one-way function of the key rather
  # than the key: disclosing it reveals nothing about secretKey. Set
  # secret.ladybugRpcSecret explicitly to use an independent value.
  #
  # Rotating secretKey rotates this too. Both pods read it from this same Secret
  # and a key rotation restarts both, so they move together.
  ladybug-rpc-secret: {{ default (printf "ladybug-rpc|%s" .Values.secret.secretKey | sha256sum) .Values.secret.ladybugRpcSecret | quote }}
  {{- if .Values.config.diskScanEnabled }}
  # Seals disk-scan credentials for the scanner pod. Derived from secretKey, like
  # the ladybug RPC secret, so it reveals nothing about it; set
  # secret.diskScanEnvelopeKey (base64 of 32 bytes) for an independent one.
  # Rendered only when disk scanning is on: off means no key exists at all.
  disk-scan-envelope-key: {{ default (printf "disk-scan-envelope|%s" .Values.secret.secretKey | sha256sum | trunc 32 | b64enc) .Values.secret.diskScanEnvelopeKey | quote }}
  {{- end }}
  {{- with .Values.secret.decisionWebhookSecret }}
  decision-webhook-secret: {{ . | quote }}
  {{- end }}
  {{- if .Values.config.oauth2Proxy }}
  {{- if not (or .Values.config.oauth2ProxyOidcIssuer .Values.secret.oauth2ProxySharedSecret) }}
  {{- fail "config.oauth2Proxy needs config.oauth2ProxyOidcIssuer (preferred: verify the IdP-signed ID token) and/or secret.oauth2ProxySharedSecret" }}
  {{- end }}
  {{- with .Values.secret.oauth2ProxySharedSecret }}
  {{- if lt (len .) 32 }}
  {{- fail "secret.oauth2ProxySharedSecret must be at least 32 characters" }}
  {{- end }}
  # Defence in depth for the oauth2-proxy path; the proxy must send the same
  # value in X-Graph-Proxy-Secret (see docs/security-hardening.md#oauth2-proxy).
  oauth2-proxy-shared-secret: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.secret.approvalWebhookSecret }}
  approval-webhook-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.approvalTokenSecret }}
  approval-token-secret: {{ . | quote }}
  {{- end }}
  {{- if .Values.sso.google.clientId }}
  google-client-secret: {{ required "secret.googleClientSecret is required with sso.google.clientId" .Values.secret.googleClientSecret | quote }}
  {{- end }}
  {{- if .Values.sso.okta.clientId }}
  okta-client-secret: {{ required "secret.oktaClientSecret is required with sso.okta.clientId" .Values.secret.oktaClientSecret | quote }}
  {{- end }}
  # The DSNs below percent-escape the passwords (urlquery) so passwords
  # containing / + = @ : etc. don't break URL parsing.
  #
  # The bundled datastores' users are fixed. Postgres: graph, the app role
  # migrate, serve and the worker connect as (not a superuser;
  # files/postgres-init.sql), graph_scanner, the scanner's role (River's and
  # the scan tables only), and postgres, the superuser whose password only the
  # Postgres StatefulSet reads. ClickHouse: graph for serve and the worker,
  # graph_scanner for the scanner, graph_migrate for the migrate init container
  # (files/clickhouse-users.xml).
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ required "secret.postgresPassword is required (the password of graph, the app role)" .Values.secret.postgresPassword | quote }}
  postgres-superuser-password: {{ required "secret.postgresSuperuserPassword is required (the bundled Postgres's bootstrap superuser; no graph pod gets it)" .Values.secret.postgresSuperuserPassword | quote }}
  postgres-scanner-password: {{ required "secret.postgresScannerPassword is required (the password of graph_scanner, the scanner's role)" .Values.secret.postgresScannerPassword | quote }}
  {{- if eq .Values.secret.postgresPassword .Values.secret.postgresSuperuserPassword }}
  {{- fail "secret.postgresSuperuserPassword must differ from secret.postgresPassword: with the same value the app's password is the superuser's" }}
  {{- end }}
  {{- if has .Values.secret.postgresScannerPassword (list .Values.secret.postgresPassword .Values.secret.postgresSuperuserPassword) }}
  {{- fail "secret.postgresScannerPassword must differ from secret.postgresPassword and secret.postgresSuperuserPassword: with the same value the scanner's password opens that role" }}
  {{- end }}
  {{- $sslMode := .Values.postgres.sslMode | default "prefer" }}
  {{- if not (has $sslMode (list "disable" "prefer" "require" "verify-ca" "verify-full")) }}
  {{- fail (printf "postgres.sslMode must be disable, prefer, require, verify-ca or verify-full, got %q" $sslMode) }}
  {{- end }}
  {{- if and (has $sslMode (list "require" "verify-ca" "verify-full")) (not .Values.postgres.tlsSecret) }}
  {{- fail (printf "postgres.sslMode=%s needs postgres.tlsSecret: without a certificate the bundled Postgres serves no TLS, so every connection would be refused" $sslMode) }}
  {{- end }}
  {{- $rootCert := ternary "&sslrootcert=/etc/graph/postgres-ca/ca.crt" "" (has $sslMode (list "verify-ca" "verify-full")) }}
  database-url: {{ printf "postgres://graph:%s@graph-postgres:5432/graph?sslmode=%s%s" (.Values.secret.postgresPassword | urlquery) $sslMode $rootCert | quote }}
  {{- if .Values.scanner.enabled }}
  scanner-database-url: {{ printf "postgres://graph_scanner:%s@graph-postgres:5432/graph?sslmode=%s%s" (.Values.secret.postgresScannerPassword | urlquery) $sslMode $rootCert | quote }}
  {{- end }}
  {{- else }}
  database-url: {{ required "secret.databaseUrl is required (external Postgres)" .Values.secret.databaseUrl | quote }}
  {{- if .Values.scanner.enabled }}
  # The scanner's own DSN: a graph_scanner role (deploy/README.md, External
  # datastores), or secret.databaseUrl's value to run it as the app role.
  scanner-database-url: {{ required "secret.scannerDatabaseUrl is required with scanner.enabled and an external Postgres: a DSN for a graph_scanner role (deploy/README.md, External datastores), or the value of secret.databaseUrl to run the scanner as the app role" .Values.secret.scannerDatabaseUrl | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.clickhouse.enabled }}
  clickhouse-password: {{ required "secret.clickhousePassword is required (the password of graph, the app user)" .Values.secret.clickhousePassword | quote }}
  clickhouse-migrate-password: {{ required "secret.clickhouseMigratePassword is required (the password of graph_migrate, the user migrate changes the schema as)" .Values.secret.clickhouseMigratePassword | quote }}
  clickhouse-scanner-password: {{ required "secret.clickhouseScannerPassword is required (the password of graph_scanner, the scanner's user)" .Values.secret.clickhouseScannerPassword | quote }}
  {{- if eq .Values.secret.clickhousePassword .Values.secret.clickhouseMigratePassword }}
  {{- fail "secret.clickhouseMigratePassword must differ from secret.clickhousePassword: with the same value the app's password opens the schema user" }}
  {{- end }}
  {{- if has .Values.secret.clickhouseScannerPassword (list .Values.secret.clickhousePassword .Values.secret.clickhouseMigratePassword) }}
  {{- fail "secret.clickhouseScannerPassword must differ from secret.clickhousePassword and secret.clickhouseMigratePassword: with the same value the scanner's password opens that user" }}
  {{- end }}
  {{- $chAddr := "@graph-clickhouse:9000/graph" }}
  {{- if .Values.clickhouse.secure }}
  {{- if not .Values.clickhouse.tlsSecret }}
  {{- fail "clickhouse.secure needs clickhouse.tlsSecret: without a certificate the bundled ClickHouse has no secure port" }}
  {{- end }}
  {{- /* The ClickHouse client checks a certificate only against the system CA
  bundle, which a certificate for graph-clickhouse does not chain to. */}}
  {{- $chAddr = "@graph-clickhouse:9440/graph?secure=true&skip_verify=true" }}
  {{- end }}
  clickhouse-url: {{ printf "clickhouse://graph:%s%s" (.Values.secret.clickhousePassword | urlquery) $chAddr | quote }}
  clickhouse-migrate-url: {{ printf "clickhouse://graph_migrate:%s%s" (.Values.secret.clickhouseMigratePassword | urlquery) $chAddr | quote }}
  {{- if .Values.scanner.enabled }}
  scanner-clickhouse-url: {{ printf "clickhouse://graph_scanner:%s%s" (.Values.secret.clickhouseScannerPassword | urlquery) $chAddr | quote }}
  {{- end }}
  {{- else }}
  clickhouse-url: {{ required "secret.clickhouseUrl is required (external ClickHouse)" .Values.secret.clickhouseUrl | quote }}
  # migrate's ClickHouse user, the one that may change the schema; the app's
  # own URL when no separate one is given.
  clickhouse-migrate-url: {{ default .Values.secret.clickhouseUrl .Values.secret.clickhouseMigrateUrl | quote }}
  {{- if .Values.scanner.enabled }}
  # The scanner's own DSN: a graph_scanner user (deploy/README.md, External
  # datastores), or secret.clickhouseUrl's value to run it as the app user.
  scanner-clickhouse-url: {{ required "secret.scannerClickhouseUrl is required with scanner.enabled and an external ClickHouse: a DSN for a graph_scanner user (deploy/README.md, External datastores), or the value of secret.clickhouseUrl to run the scanner as the app user" .Values.secret.scannerClickhouseUrl | quote }}
  {{- end }}
  {{- end }}
{{- end }}
