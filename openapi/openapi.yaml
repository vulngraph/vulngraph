openapi: 3.1.0

# Root index for the Vulngraph REST API. This file holds only cross-cutting
# pieces: API metadata, security, the path → operation map, and shared components
# (the RFC 9457 Problem shape, the `id` path param, and the reusable error
# responses). Each operation's detail and schemas live in openapi/domains/<domain>.yaml,
# one file per Go domain (internal/app/<domain>) so a handler change and its spec
# change touch matching files. Keep this index thin; keep domain files self-contained.
#
# Out of scope by design: the MCP seam (POST /api/mcp, JSON-RPC 2.0), the
# provider webhook (POST /api/webhooks/github/{id}, HMAC-authed), and the four
# browser OAuth redirect legs under /api/auth/{google,okta}[/callback] — see the
# reasoned exemption list in internal/httpsrv/openapi_coverage_test.go, which fails
# CI for any registered route that is neither documented here nor exempted there.

info:
  title: Vulngraph API
  version: 1.0.0
  description: |
    REST API for the Vulngraph security platform. JSON over HTTP, snake_case
    fields, RFC 9457 problem details for errors. Session auth via the HttpOnly
    `graph_session` cookie; automation may use an equivalent bearer token.

servers:
  - url: /
    description: Same-origin (the Go binary serves both the API and the SPA)

tags:
  - name: auth
  - name: users
  - name: assets
  - name: identity
  - name: alert-context
  - name: findings
