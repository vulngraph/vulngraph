    title: Key Vault uses RBAC authorization
    service: key-vault
    status: covered
    check_ids: [azure-keyvault-access-policy-model]
    reason: "Vault properties.enableRbacAuthorization not true (documented default false)."
    severity: medium
  - id: "8.3.7"
    title: Vaults reachable only from private networks
    service: key-vault
    status: covered
    check_ids: [azure-keyvault-public-network-access]
    reason: "Vault properties.publicNetworkAccess not Disabled (documented default enabled); Medium when networkAcls.defaultAction is Allow or unset, Low when the vault firewall denies by default."
    severity: high
  - id: "8.3.8"
    title: Key Vault reached through private endpoints
    service: key-vault
    status: covered
    check_ids: [azure-keyvault-no-private-endpoint]
    reason: "Vault properties.privateEndpointConnections has no Approved connection (omitted means none)."
    severity: medium
  - id: "8.3.9"
    title: Key Vault keys rotate automatically
    service: key-vault
    status: covered
    check_ids: [azure-keyvault-key-no-rotation]
    reason: "Enabled keys with no Rotate lifetime action: read from the ARM key's rotationPolicy when present, else the data-plane GET /keys/{name}/rotationpolicy (needs a data-plane read role and network reach; when that read fails the vault's rotation is unknown, never compliant)."
    severity: medium
  - id: "8.3.10"
    title: Use Managed HSM where required
    service: key-vault
    status: manual
    reason: Whether a workload requires FIPS 140 Level 3 HSM is a compliance judgement.
    severity: low
  - id: "8.3.11"
    title: Certificate validity at most 12 months
    service: key-vault
    status: covered
    check_ids: [azure-keyvault-cert-validity-long]
    reason: "Current, enabled certificates whose issued validity (not-before to expiry, plus a day of slack) exceeds 12 months, read from the Key Vault data-plane certificate list (GET /certificates, api 7.4): the outcome of the issuance policy's validity_months. The data-plane read needs Key Vault Reader (RBAC vaults) or a List certificates access policy, plus network reach; when it fails the vault's certificate keys stay absent (unknown), never zero."
    severity: low
  - id: "8.4.1"
    title: Bastion deployed for VM remote access
    service: bastion
    status: covered
    check_ids: [azure-no-bastion-host]
    reason: "Counts the subscription's Bastion hosts (bastionHosts list); fires once on the subscription when there are none and the subscription runs at least one VM (a subscription with no VMs has nothing to reach)."
    severity: low
  - id: "8.5"
    title: DDoS network protection on virtual networks
    service: networking
    status: covered
    check_ids: [azure-vnet-no-ddos-protection]
    reason: "Reads properties.enableDdosProtection from the VNet list (unset is disabled)."
    severity: low
  # ── 9 Storage ────────────────────────────────────────────────────────────
  - id: "9.1.1"
    title: File share soft delete enabled
    service: storage
    status: covered
    check_ids: [azure-storage-file-soft-delete-off]
    reason: "Reads FileServices GetServiceProperties (shareDeleteRetentionPolicy.enabled; absent from a read response is off) on accounts whose kind has a file service and that hold at least one share (share listing, read until an SMB share is seen). Unknown when either read fails."
    severity: medium
  - id: "9.1.2"
    title: SMB file shares require SMB 3.1.1 or newer
    service: storage
    status: covered
    check_ids: [azure-storage-smb-legacy-version]
    reason: "Reads protocolSettings.smb.versions from the file service properties; fires unless the list is exactly SMB3.1.1 (unset accepts every version). Only accounts holding an SMB share are evaluated; NFS shares ignore SMB settings."
    severity: medium
  - id: "9.1.3"
    title: SMB channel encryption AES-256-GCM or stronger
    service: storage
    status: covered
    check_ids: [azure-storage-smb-weak-channel-encryption]
    reason: "Reads protocolSettings.smb.channelEncryption; fires unless the list is exactly AES-256-GCM (unset accepts all three ciphers). Only accounts holding an SMB share are evaluated; NFS shares ignore SMB settings."
    severity: medium
  - id: "9.2.1"
    title: Blob soft delete enabled
    service: storage
    status: covered
    check_ids: [azure-storage-blob-soft-delete-off]
    reason: "Reads BlobServices GetServiceProperties (deleteRetentionPolicy.enabled; absent from a read response is off) on every account kind with a blob service. Unknown when the read fails."
    severity: medium
  - id: "9.2.2"
    title: Container soft delete enabled
    service: storage
    status: covered
    check_ids: [azure-storage-container-soft-delete-off]
    reason: "Reads containerDeleteRetentionPolicy.enabled from the blob service properties. Legacy GPv1 accounts are exempt: Azure does not offer container soft delete on them, so the remedy is the GPv2 upgrade."
    severity: medium
  - id: "9.2.3"
    title: Blob versioning enabled
    service: storage
    status: covered
    check_ids: [azure-storage-blob-versioning-off]
    reason: "Reads isVersioningEnabled from the blob service properties. Hierarchical-namespace (Data Lake Gen2) and legacy GPv1 accounts are exempt: Azure does not support versioning on them, so they cannot comply."
    severity: medium
  - id: "9.3.1.1"
    title: Storage key rotation reminders enabled
    service: storage
    status: covered
    check_ids: [azure-storage-no-key-expiry-policy]
    reason: "Fires when properties.keyPolicy.keyExpirationPeriodInDays is unset. Accounts with Shared Key authorization disabled (9.3.1.3 compliant) do not fire: their keys cannot authenticate, so a rotation reminder governs no credential."
    severity: low
  - id: "9.3.1.2"
    title: Storage access keys regenerated periodically
    service: storage
    status: covered
    check_ids: [azure-storage-key-not-rotated]
    reason: "Compares properties.keyCreationTime.key1/key2 to 90 days. Within a returned keyCreationTime object, Azure documents a null key time as \"not yet set\" on older accounts and says rotating the key sets it, so a null key has not been rotated since key-creation tracking began and is graded stale. A missing keyCreationTime object stays unknown. Accounts with Shared Key authorization disabled do not fire: those keys are not credentials."
    severity: medium
  - id: "9.3.1.3"
    title: Shared key access disabled on storage accounts
    service: storage
    status: covered
    check_ids: [azure-storage-shared-key-access]
    reason: "Reads properties.allowSharedKeyAccess (null is documented as true)."
    severity: medium
  - id: "9.3.2.1"
    title: Storage accounts reached through private endpoints
    service: storage
    status: covered
    check_ids: [azure-storage-no-private-endpoint]
    reason: "Counts privateEndpointConnections whose connection state is Approved; fires on zero."
    severity: medium
  - id: "9.3.2.2"
    title: Storage public network access disabled
    service: storage
    status: covered
    check_ids: [azure-storage-default-network-allow, azure-storage-public-network-access]
    reason: "Fires when publicNetworkAccess is Enabled (null is Enabled: Disabled is only ever set explicitly) — as azure-storage-default-network-allow when the firewall also defaults to Allow, otherwise as azure-storage-public-network-access, so one finding per account. SecuredByPerimeter is treated as compliant."
    severity: high
  - id: "9.3.2.3"
    title: Storage network default action is deny
    service: storage
    status: covered
    check_ids: [azure-storage-default-network-allow]
    reason: "Reads properties.networkRuleSet.defaultAction; steps aside when public network access is Disabled or SecuredByPerimeter, where the firewall is not consulted."
    severity: high
  - id: "9.3.3.1"
    title: Portal defaults to Entra authorization for storage
    service: storage
    status: covered
    check_ids: [azure-storage-portal-not-entra-auth]
    reason: "Reads properties.defaultToOAuthAuthentication (null is documented as false)."
    severity: low
  - id: "9.3.4"
    title: Storage requires secure transfer
    service: storage
    status: covered
    check_ids: [azure-storage-https-not-enforced]
    reason: Reads properties.supportsHttpsTrafficOnly; silent when the property is absent.
    severity: medium
  - id: "9.3.5"
    title: Trusted Azure services may bypass storage firewall
    service: storage
    status: covered
    check_ids: [azure-storage-trusted-services-bypass-off]
    reason: "Fires when networkRuleSet.defaultAction is Deny and bypass lacks AzureServices; the bypass is irrelevant while the firewall allows everything."
    severity: low
  - id: "9.3.6"
    title: Storage minimum TLS version is 1.2
    service: storage
    status: covered
    check_ids: [azure-storage-min-tls-below-12]
    reason: "Reads properties.minimumTlsVersion (null is documented as TLS 1.0). Graded Low: Azure Storage has refused TLS below 1.2 platform-wide since February 2026."
    severity: high
  - id: "9.3.7"
    title: Cross-tenant replication disabled
    service: storage
    status: covered
    check_ids: [azure-storage-cross-tenant-replication]
    reason: "Reads properties.allowCrossTenantReplication. Null is resolved by the documented cutover: it allows cross-tenant replication on accounts created before 15 December 2023 and disallows it after (properties.creationTime); with no creation time it stays unknown."
    severity: medium
  - id: "9.3.8"
    title: Anonymous blob access disabled
    service: storage
    status: covered
    check_ids: [azure-storage-public-blob-access]
    reason: Reads properties.allowBlobPublicAccess (nil treated as allowed). Account-level permission only; per-container public access level is not read.
    severity: high
  - id: "9.3.9"
    title: Delete locks on storage accounts
    service: storage
    status: covered
    check_ids: [azure-storage-no-delete-lock]
    reason: "Reads the subscription's management locks (ListAtSubscriptionLevel returns locks at every scope): fires when no CanNotDelete or ReadOnly lock (both block deletion) sits on the account, its resource group or the subscription. Unknown when the lock listing fails."
    severity: low
  - id: "9.3.10"
    title: Consider read-only locks on storage accounts
    service: storage
    status: manual
    reason: CIS asks only that read-only locks be considered; whether they fit the workload is a judgement.
    severity: low
  - id: "9.3.11"
    title: Critical storage accounts are geo-redundant
    service: storage
    status: covered
    check_ids: [azure-storage-not-geo-redundant]
    reason: "Fires on Standard_LRS/Standard_ZRS accounts. No API marks an account critical, so every Standard account is evaluated and graded Info; Premium SKUs offer no geo-redundant option and are exempt."
    severity: low
