apiVersion: v1
kind: ServiceAccount
{{ include "graph.serviceAccountMeta" (dict "name" .Values.serviceAccount.name "root" .) }}
{{- if include "graph.serveServiceAccountSplit" . }}
---
apiVersion: v1
kind: ServiceAccount
{{ include "graph.serviceAccountMeta" (dict "name" .Values.serviceAccount.serveName "root" .) }}
{{- end }}
{{- if .Values.scanner.enabled }}
---
# The scanner's own identity: no cloud identity annotations and no API token,
# because nothing in the scanner calls a cloud or Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.scanner.serviceAccountName }}
  labels:
    {{- include "graph.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
