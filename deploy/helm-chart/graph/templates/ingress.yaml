{{- if .Values.ingress.enabled }}
# Off by default. Point this at whatever ingress controller and auth layer you
# run (nginx-ingress, an internal-only class, a cloud LB, oauth2-proxy, IAP,
# ...) via ingress.host + ingress.annotations — see deploy/README.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graph
  labels:
    {{- include "graph.labels" . | nindent 4 }}
    {{- with .Values.ingress.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ required "ingress.host is required when ingress.enabled" .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress.enabled" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: graph
                port:
                  number: {{ .Values.service.port }}
{{- end }}
