    title: "S3 buckets block public read access"
    service: s3
    status: covered
    check_ids: [aws-s3-public-read]
    reason: "Public READ split from write: AWS's GetBucketPolicyStatus says the policy is public and an Allow to everyone (Principal \"*\", or NotPrincipal) grants s3:GetObject/GetObjectVersion/ListBucket/ListBucketVersions (not taken back by an unconditional Deny that reaches everyone) — unconditioned, or conditioned only on keys AWS does not treat as restricting (a statement scoped by aws:SourceVpc/SourceVpce/SourceIp/PrincipalOrgID/SourceAccount and the like is not public) — unless RestrictPublicBuckets; or the ACL grants READ/FULL_CONTROL to AllUsers/AuthenticatedUsers, unless IgnorePublicAcls (bucket and account blocks combined). When the public part of a policy grants no nameable data action the split is unknown and aws-s3-public-bucket reports the bucket. Absent unless the policy, its status and the ACL were all read."
    severity: critical
