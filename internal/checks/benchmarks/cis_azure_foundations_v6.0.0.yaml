    title: Alert on Service Health events
    service: monitor
    status: covered
    check_ids: [azure-activity-log-alerts-missing]
    reason: "Microsoft.Insights/activityLogAlerts: no enabled alert scoped to the subscription matching this control's operationName (equals, containsAny or anyOf) with a category that carries the event or no category filter: Administrative for every operation, and Security too for the security-solution operations (the category CIS's remediation uses); an alert on a whole accepted category also counts, or for 6.1.2.11 the ServiceHealth category. Alerts narrowed by resourceGroup, resourceId or caller do not count. One finding lists every missing alert."
    severity: low
  - id: "6.1.3.1"
    title: Application telemetry collected with App Insights
    service: monitor
    status: covered
    check_ids: [azure-no-application-insights]
    reason: "Microsoft.Insights/components list is empty while the subscription hosts App Service apps (complete web-app listing). Not applicable where the subscription runs no App Service apps."
    severity: low
  - id: "6.1.4"
    title: Resource logging enabled wherever supported
    service: monitor
    status: covered
    check_ids: [azure-resource-logging-disabled, azure-keyvault-audit-logging-off]
    reason: "One subscription finding listing the network security groups, application gateways, App Service apps and public IP addresses with no exporting diagnostic setting (one Microsoft.Insights/diagnosticSettings list per resource, bounded fan-out; any failed read or incomplete listing leaves it unknown). Key vaults are covered per vault by azure-keyvault-audit-logging-off. VMs, disks and VNets have no resource-log categories of their own; resource types graph does not inventory (e.g. Databricks, Cosmos DB) cannot be evaluated."
    severity: medium
  - id: "6.1.5"
    title: No basic or free SKUs on production
    service: monitor
    status: manual
    reason: SKUs are readable (sku is collected on storage, LBs, SQL) but which resources are production with SLA needs is an owner judgement.
    severity: low
  - id: "6.2"
    title: Lock mission-critical resources
    service: governance
    status: manual
    reason: Microsoft.Authorization/locks is listable, but which resources are mission-critical is an owner judgement.
    severity: low
  # ── 7 Networking ─────────────────────────────────────────────────────────
  - id: "7.1"
    title: RDP not open from the internet
    service: networking
    status: covered
    check_ids: [azure-nsg-rdp-not-open-internet, azure-nsg-all-ports-open-internet]
    reason: Evaluates NSG custom inbound rules in priority order for TCP/any 3389 from */Internet/Any/0.0.0.0/0; default rules are not collected (the default DenyAllInbound cannot open RDP). A port admitted by an all-ports rule is reported once by azure-nsg-all-ports-open-internet instead of by every per-port check.
    severity: high
  - id: "7.2"
    title: SSH not open from the internet
    service: networking
    status: covered
    check_ids: [azure-nsg-ssh-not-open-internet, azure-nsg-all-ports-open-internet]
    reason: Same NSG evaluation as 7.1 for port 22.
    severity: high
  - id: "7.3"
    title: UDP not open from the internet
    service: networking
    status: covered
    check_ids: [azure-nsg-udp-open-internet, azure-nsg-all-ports-open-internet]
    reason: "Evaluates NSG custom inbound rules in priority order for udp/*/any from */Internet/Any/0.0.0.0/0 on any port (exact at every rule boundary); default rules are not collected (DenyAllInbound cannot open UDP). All-ports rules are reported by azure-nsg-all-ports-open-internet."
    severity: high
  - id: "7.4"
    title: HTTP and HTTPS not open from the internet
    service: networking
    status: covered
    check_ids: [azure-nsg-http-open-internet, azure-nsg-all-ports-open-internet]
    reason: "Same NSG evaluation as 7.1 for TCP 80 and 443."
    severity: medium
  - id: "7.5"
    title: NSG flow log retention at least 90 days
    service: networking
    status: covered
    check_ids: [azure-nsg-flow-log-retention-short]
    reason: "Fires on an enabled NSG flow log whose retention policy is enabled with 1-89 days; a disabled policy or 0 days keeps records indefinitely and passes."
    severity: low
  - id: "7.6"
    title: Network Watcher enabled in used regions
    service: networking
    status: covered
    check_ids: [azure-network-watcher-missing-region]
    reason: "Compares the Network Watcher list's locations with the regions holding a VNet (every VM, NIC, gateway and private endpoint lives in one); one finding on the subscription naming the uncovered regions. Display-form and short-form region names are folded together."
    severity: low
  - id: "7.7"
    title: Review public IP addresses periodically
    service: networking
    status: manual
    reason: A periodic review process. Public IPs are already inventoried (`azure_public_ip` assets) and azure-vm-direct-public-ip flags VM-attached ones, but neither attests a review.
    severity: medium
  - id: "7.8"
    title: VNet flow log retention at least 90 days
    service: networking
    status: covered
    check_ids: [azure-vnet-flow-log-retention-short]
    reason: "Fires on an enabled VNet flow log whose retention policy is enabled with 1-89 days; a disabled policy or 0 days keeps records indefinitely and passes."
    severity: low
  - id: "7.9"
    title: VPN point-to-site uses Entra authentication only
    service: networking
    status: covered
    check_ids: [azure-vpn-p2s-non-entra-auth]
    reason: "Reads each VPN-type virtual network gateway (generic resource listing, then a GET per gateway): fires when point-to-site is configured and its authentication types are anything but exactly AAD. Older gateways that leave vpnAuthenticationTypes empty have the type implied from the configured Entra tenant, root certificates or RADIUS server; when nothing implies one the gateway stays unknown."
    severity: medium
  - id: "7.10"
    title: Application Gateway has WAF enabled
    service: application-gateway
    status: covered
    check_ids: [azure-appgw-no-waf]
    reason: "Fires when a gateway has neither an enabled inline WAF configuration nor an attached WAF policy whose policySettings.state is Enabled (read from the WAF policy list). When the policy listing fails, or the attached policy is not in it, the gateway's WAF state is unknown rather than assumed on."
    severity: high
  - id: "7.11"
    title: Every subnet has a network security group
    service: networking
    status: covered
    check_ids: [azure-subnet-no-nsg]
    reason: "Reads subnet.properties.networkSecurityGroup from the VNet list; exempts the reserved platform subnets Azure forbids or manages NSGs on (GatewaySubnet, AzureFirewallSubnet, AzureFirewallManagementSubnet, RouteServerSubnet)."
    severity: medium
  - id: "7.12"
    title: Application Gateway requires TLS 1.2 or newer
    service: application-gateway
    status: covered
    check_ids: [azure-appgw-min-tls-below-12]
    reason: "Resolves the lowest TLS version across the gateway SSL policy and every SSL profile (listener-specific) policy, from minProtocolVersion, the predefined policyName or the legacy disabledSslProtocols list. A gateway with no SSL policy runs its SKU's default: AppGwSslPolicy20220101 (TLS 1.2) on v2 and Basic since the August 2025 TLS 1.0/1.1 retirement, AppGwSslPolicy20150501 (TLS 1.0) on v1, whose default Microsoft left unchanged. A custom policy naming only cipher suites, or a default with no SKU tier reported, stays unknown."
    severity: high
  - id: "7.13"
    title: Application Gateway HTTP/2 enabled
    service: application-gateway
    status: covered
    check_ids: [azure-appgw-http2-disabled]
    reason: "Reads properties.enableHttp2 from the Application Gateway list (unset is disabled)."
    severity: low
  - id: "7.14"
    title: WAF policy inspects request bodies
    service: application-gateway
    status: covered
    check_ids: [azure-waf-no-request-body-inspection]
    reason: "Reads the Application Gateway WAF policy list: fires on a policy attached to a gateway, listener or path rule whose policySettings.requestBodyCheck is false. Unattached policies protect nothing and are skipped; an unset value has no documented default and stays unknown."
    severity: medium
  - id: "7.15"
    title: WAF policy has bot protection
    service: application-gateway
    status: covered
    check_ids: [azure-waf-no-bot-protection]
    reason: "Fires on an attached WAF policy whose managed rule sets do not include Microsoft_BotManagerRuleSet."
    severity: medium
  - id: "7.16"
    title: Network Security Perimeter protects PaaS resources
    service: networking
    status: manual
    reason: Which PaaS resources belong inside a perimeter is a design decision; Microsoft.Network/networkSecurityPerimeters is listable but cannot judge intent.
    severity: low
