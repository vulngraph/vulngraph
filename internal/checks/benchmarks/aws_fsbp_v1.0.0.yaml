benchmark: aws-fsbp
name: AWS Foundational Security Best Practices
version: "1.0.0"
family: fsbp
providers: [aws]
source: https://docs.aws.amazon.com/securityhub/latest/userguide/fsbp-standard.html
controls:
  - id: "Account.1"
    title: "Security contact registered for the account"
    service: account
    status: covered
    check_ids: [aws-account-no-security-contact]
    reason: "account:GetAlternateContact (SECURITY) on aws_account_settings."
    severity: medium
  - id: "ACM.1"
    title: "Certificates renewed before expiry window"
    service: acm
    status: covered
    check_ids: [acm-cert-expiring-soon]
    reason: "Collector sets expiring_soon at <=30 days (FSBP default daysToExpiration=30) for issued and imported certificates."
    severity: medium
  - id: "ACM.2"
    title: "ACM RSA certificates use keys of 2048+ bits"
    service: acm
    status: covered
    check_ids: [aws-acm-rsa-key-too-short]
    reason: "`key_algorithm` RSA_<n> with n < 2048. ListCertificates now passes every key type (the API default lists RSA_2048 only, which hid RSA_1024 certificates)."
    severity: high
  - id: "APIGateway.1"
    title: "API Gateway stage execution logging enabled"
    service: apigateway
    status: covered
    check_ids: [aws-apigateway-stage-execution-logging-disabled]
    reason: "apigateway:GetStages / apigatewayv2:GetStages per API on api_gateway_stage. REST: the */* loggingLevel (unset = OFF) must be ERROR or INFO and no method override may set OFF; WebSocket: defaultRouteSettings.LoggingLevel, route overrides likewise. HTTP API stages have no execution logging and are not graded. Low (audit hygiene)."
    severity: medium
  - id: "APIGateway.2"
    title: "REST stages use client certificate for backend"
    service: apigateway
    status: covered
    check_ids: [aws-apigateway-stage-no-client-certificate]
    reason: "REST stage clientCertificateId empty (apigateway:GetStages). Low: backend authentication of API Gateway is defence in depth."
    severity: medium
  - id: "APIGateway.3"
    title: "REST stages have X-Ray tracing enabled"
    service: apigateway
    status: covered
    check_ids: [aws-apigateway-stage-xray-disabled]
    reason: "REST stage tracingEnabled=false (apigateway:GetStages). Low."
    severity: low
  - id: "APIGateway.4"
    title: "API Gateway associated with a WAF web ACL"
    service: apigateway
    status: covered
    check_ids: [aws-apigateway-stage-no-waf]
    reason: "REST stage webAclArn empty (apigateway:GetStages, which reports the associated WAF web ACL). Low: reachability is aws-apigateway-public-endpoint's finding."
    severity: medium
  - id: "APIGateway.5"
    title: "REST API cache encrypted at rest"
    service: apigateway
    status: covered
    check_ids: [aws-apigateway-stage-cache-unencrypted]
    reason: "REST stage with the cache cluster on and a methodSettings entry with cachingEnabled and not cacheDataEncrypted; methods with caching off are not graded (as the control), and method caching without a cache cluster caches nothing so is not graded either. Low."
    severity: medium
  - id: "APIGateway.8"
    title: "API Gateway V2 routes specify authorization"
    service: apigateway
    status: covered
    check_ids: [aws-apigatewayv2-route-no-authorization]
    reason: "apigatewayv2:GetRoutes rolled up on the v2 api_gateway asset (one finding per API naming the routes). Authorization type NONE or unset fails; on WebSocket APIs only $connect is graded (no other route can carry an authorizer) and a WebSocket API with no $connect route fails as anonymous. Medium (the FSBP grade); aws-apigateway-public-endpoint steps aside for the same API. An API with its execute-api endpoint disabled and no custom domain mapped (apigatewayv2:GetDomainNames + GetApiMappings) answers on no URL and is not graded; unread mappings keep it reachable. A failed route read leaves the keys absent."
    severity: medium
  - id: "APIGateway.9"
    title: "API Gateway V2 stages have access logging"
    service: apigateway
    status: partial
    check_ids: [aws-apigateway-access-logging-off]
    reason: "Every v2 (HTTP and WebSocket) stage the control covers is graded: apigatewayv2:GetStages accessLogSettings.destinationArn as access_log_destination on api_gateway_stage (\"\" when off, absent when unread), one finding per stage. Partial, not covered, by choice: the same check also fires on REST stages, which CIS AWS 4.10 needs and APIGateway.9 does not cover, so mapping this row is broader than the control (an api_type=REST finding is CIS 4.10 evidence only). Splitting it would put two findings on every v2 stage."
    severity: medium
  - id: "APIGateway.10"
    title: "V2 private integrations use HTTPS"
    service: apigateway
    status: covered
    check_ids: [aws-apigatewayv2-private-integration-no-tls]
    reason: "apigatewayv2:GetIntegrations: VPC_LINK integrations with no TlsConfig, rolled up on the API. Low."
    severity: medium
  - id: "APIGateway.11"
    title: "Custom domains use recommended TLS policy"
    service: apigateway
    status: covered
    check_ids: [aws-apigateway-domain-weak-tls-policy]
    reason: "apigateway:GetDomainNames (covers custom domains of REST, HTTP and WebSocket APIs) securityPolicy outside the five 2025 enhanced policies the control accepts. TLS_1_0 Medium, any other Low."
    severity: medium
  - id: "AppSync.2"
    title: "AppSync field-level logging enabled"
    service: appsync
    status: covered
    check_ids: [aws-appsync-field-logging-disabled]
    reason: "appsync:ListGraphqlApis logConfig.fieldLogLevel NONE, or no log configuration at all. ERROR, ALL, INFO and DEBUG all count as enabled."
    severity: medium
  - id: "AppSync.5"
    title: "AppSync GraphQL APIs avoid API-key auth"
    service: appsync
    status: covered
    check_ids: [aws-appsync-api-key-auth]
    reason: "appsync:ListGraphqlApis authenticationType or any additionalAuthenticationProviders entry is API_KEY."
    severity: high
  - id: "Athena.4"
    title: "Athena workgroup logging enabled"
    service: athena
    status: covered
    check_ids: [aws-athena-workgroup-no-metrics]
    reason: "athena:ListWorkGroups + GetWorkGroup PublishCloudWatchMetricsEnabled (absent in a read configuration = off). The stock primary workgroup is graded only when athena:ListQueryExecutions shows a query ran in it, so unused Athena is not reported in every region."
    severity: medium
  - id: "AutoScaling.1"
    title: "Load-balanced ASGs use ELB health checks"
    service: autoscaling
    status: covered
    check_ids: [aws-asg-no-elb-health-check]
    reason: "autoscaling:DescribeAutoScalingGroups: a group with load balancers or target groups (or ELB traffic sources) whose HealthCheckType does not include ELB."
    severity: low
  - id: "AutoScaling.2"
    title: "ASG spans multiple Availability Zones"
    service: autoscaling
    status: covered
    check_ids: [aws-asg-single-az]
    reason: "DescribeAutoScalingGroups AvailabilityZones count < 2 (the FSBP default minimum)."
    severity: medium
  - id: "AutoScaling.3"
    title: "ASG launch configurations require IMDSv2"
    service: autoscaling
    status: covered
    check_ids: [aws-asg-launch-config-imdsv1]
    reason: "autoscaling:DescribeLaunchConfigurations: HttpTokens optional or no metadata options (FSBP fails both); a disabled endpoint is exempt. Medium when a group uses the configuration, Low otherwise."
    severity: high
  - id: "Autoscaling.5"
    title: "ASG launch configurations assign no public IPs"
    service: autoscaling
    status: covered
    check_ids: [aws-asg-launch-config-public-ip]
    reason: "DescribeLaunchConfigurations AssociatePublicIpAddress=true. Medium when a group uses the configuration, Low otherwise."
    severity: high
  - id: "AutoScaling.6"
    title: "ASG uses multiple instance types across AZs"
    service: autoscaling
    status: covered
    check_ids: [aws-asg-single-instance-type]
    reason: "A group without a mixed instances policy of two or more distinct types (attribute-based InstanceRequirements count as multiple). Info."
    severity: medium
  - id: "AutoScaling.9"
    title: "ASG uses EC2 launch templates"
    service: autoscaling
    status: covered
    check_ids: [aws-asg-uses-launch-configuration]
    reason: "A group launching from LaunchConfigurationName rather than a launch template or a mixed instances policy's template."
    severity: medium
  - id: "Backup.1"
    title: "Backup recovery points encrypted at rest"
    service: backup
    status: covered
    check_ids: [aws-backup-recovery-points-unencrypted]
    reason: "backup:ListRecoveryPointsByBackupVault per vault (skipped for vaults ListBackupVaults reports empty), counting recovery points with IsEncrypted=false; one finding per vault with the count as evidence. A partially read listing leaves the count absent."
    severity: medium
  - id: "Bedrock.1"
    title: "Bedrock data sources encrypted with a customer managed KMS key"
    service: bedrock
    status: missing
    reason: "No Bedrock knowledge-base collector: needs bedrock-agent:ListKnowledgeBases, ListDataSources and GetDataSource (serverSideEncryptionConfiguration.kmsKeyArn) per region. Not collected, so not graded."
    severity: medium
  - id: "BedrockAgentCore.1"
    title: "AgentCore runtimes use VPC network mode"
    service: bedrockagentcore
    status: covered
    check_ids: [aws-agentcore-runtime-public-network]
    reason: "GetAgentRuntime NetworkConfiguration.NetworkMode=PUBLIC; runtimes with a CapacityProviderConfiguration are excluded, as the control specifies."
    severity: high
  - id: "BedrockAgentCore.2"
    title: "AgentCore gateways require inbound authorization"
    service: bedrockagentcore
    status: covered
    check_ids: [aws-agentcore-gateway-no-inbound-auth]
    reason: "ListGateways authorizerType=NONE."
    severity: high
  - id: "BedrockAgentCore.5"
    title: "AgentCore custom browsers avoid public network mode"
    service: bedrockagentcore
    status: covered
    check_ids: [aws-agentcore-browser-public-network]
    reason: "ListBrowsers (type CUSTOM) + GetBrowser NetworkConfiguration.NetworkMode=PUBLIC."
    severity: high
  - id: "BedrockAgentCore.6"
    title: "AgentCore custom browsers record sessions"
    service: bedrockagentcore
    status: covered
    check_ids: [aws-agentcore-browser-no-session-recording]
    reason: "GetBrowser recording disabled or absent, or enabled without an S3 location (custom browsers)."
    severity: medium
  - id: "BedrockAgentCore.7"
    title: "AgentCore custom code interpreters use a private network"
    service: bedrock-agentcore
    status: missing
    reason: "The AgentCore collector lists runtimes, gateways and custom browsers only; custom code interpreters (bedrock-agentcore-control:ListCodeInterpreters + GetCodeInterpreter networkConfiguration.networkMode, PUBLIC or SANDBOX fails) are not collected yet."
    severity: high
  - id: "CloudFormation.3"
    title: "CloudFormation stacks have termination protection"
    service: cloudformation
    status: covered
    check_ids: [aws-cfn-stack-no-termination-protection]
    reason: "`EnableTerminationProtection` false on a root stack (nested stacks inherit it from the root). The unfiltered DescribeStacks listing may leave the flag out, so a root stack listed without it is described on its own (bounded, 4 at a time); a failed describe leaves it unknown."
    severity: medium
  - id: "CloudFormation.4"
    title: "CloudFormation stacks use a service role"
    service: cloudformation
    status: covered
    check_ids: [aws-cfn-stack-no-service-role]
    reason: "cloudformation:DescribeStacks `RoleARN` empty on a root stack (nested stacks use the root's role). A stack named like a StackSet stack instance (StackSet-<set>-<id>) is graded Info rather than Low: a StackSet deploys through its execution or service-linked role, never the caller's credentials, but the name is the only evidence a member account can read (ListStackInstances needs the StackSet admin account) and anyone can choose it, so it lowers the grade and never silences the finding."
    severity: medium
  - id: "CloudFront.1"
    title: "CloudFront distribution sets a default root object"
    service: cloudfront
    status: covered
    check_ids: [aws-cloudfront-no-default-root-object]
    reason: "GetDistributionConfig DefaultRootObject empty on a distribution with an S3 origin (the root can list or error out the bucket), Low. Distributions with only application origins are skipped: the application answers the root itself. Unread config = key absent."
    severity: high
  - id: "CloudFront.3"
    title: "CloudFront requires HTTPS to viewers"
    service: cloudfront
    status: covered
    check_ids: [aws-cloudfront-viewer-http-allowed]
    reason: "Default and every ordered cache behaviour from the ListDistributions summary; any ViewerProtocolPolicy allow-all fires, naming the behaviours."
    severity: medium
  - id: "CloudFront.4"
    title: "CloudFront origin failover configured"
    service: cloudfront
    status: covered
    check_ids: [aws-cloudfront-no-origin-failover]
    reason: "OriginGroups.Quantity = 0 from the summary; Info (resilience only)."
    severity: low
  - id: "CloudFront.5"
    title: "CloudFront access logging enabled"
    service: cloudfront
    status: covered
    check_ids: [aws-cloudfront-logging-disabled]
    reason: "Logged = legacy Logging.Enabled (GetDistributionConfig) OR a standard-logging v2 delivery whose source names the distribution ARN (logs:DescribeDeliverySources + DescribeDeliveries, us-east-1). Fires only when both were read and neither is on; either read failing leaves logging_enabled absent unless the other proves it on."
    severity: medium
  - id: "CloudFront.6"
    title: "CloudFront distribution has WAF attached"
    service: cloudfront
    status: covered
    check_ids: [aws-cloudfront-no-waf]
    reason: "WebACLId empty in the summary (v2 ARN or Classic id both count); Low, defense in depth."
    severity: medium
  - id: "CloudFront.7"
    title: "CloudFront uses a custom TLS certificate"
    service: cloudfront
    status: covered
    check_ids: [aws-cloudfront-default-certificate]
    reason: "ViewerCertificate.CloudFrontDefaultCertificate = true."
    severity: low
  - id: "CloudFront.8"
    title: "CloudFront serves HTTPS via SNI"
    service: cloudfront
    status: covered
    check_ids: [aws-cloudfront-dedicated-ip-ssl]
    reason: "Custom certificate with SSLSupportMethod vip or static-ip; Info. Default-certificate distributions are CloudFront.7's."
    severity: low
  - id: "CloudFront.9"
    title: "CloudFront encrypts traffic to custom origins"
    service: cloudfront
    status: covered
    check_ids: [aws-cloudfront-origin-unencrypted]
    reason: "Custom origins with OriginProtocolPolicy http-only, or match-viewer where a behaviour routing to the origin (directly or via an origin group) is allow-all. S3 website endpoints are custom HTTP-only origins and fire, as in the control. VPC origins (protocol on a separate resource) are not graded."
    severity: medium
  - id: "CloudFront.10"
    title: "CloudFront avoids deprecated SSL to custom origins"
    service: cloudfront
    status: covered
    check_ids: [aws-cloudfront-origin-sslv3]
    reason: "SSLv3 in a custom origin's OriginSslProtocols; http-only origins are CloudFront.9's finding (they never negotiate TLS)."
    severity: medium
  - id: "CloudFront.12"
    title: "CloudFront S3 origins point to existing buckets"
    service: cloudfront
    status: covered
    check_ids: [aws-cloudfront-dangling-s3-origin]
    reason: "Every S3 origin bucket (REST and static-website endpoints, a superset of the control, which covers REST only; both are claimable) is probed with s3:HeadBucket: 404 = missing (fires, High; Low on a disabled distribution); 403/301 = exists, and is cross-checked against the account's own buckets (s3:ListBuckets): owned passes, not owned is another account's bucket behind the distribution (fires, Medium, possible takeover); anything else, or an unreadable bucket list, = unknown (key absent unless another bucket is proven missing or foreign)."
    severity: high
  - id: "CloudFront.13"
    title: "CloudFront S3 origins use origin access control"
    service: cloudfront
    status: covered
    check_ids: [aws-cloudfront-s3-origin-no-oac]
    reason: "S3 REST origins (S3OriginConfig set or an S3 REST endpoint) with no OriginAccessControlId; a legacy OAI does not count, per the control. An origin whose bucket is proven missing is reported by aws-cloudfront-dangling-s3-origin instead."
    severity: medium
  - id: "CloudFront.15"
    title: "CloudFront uses the recommended TLS policy"
    service: cloudfront
    status: covered
    check_ids: [aws-cloudfront-weak-viewer-tls]
    reason: "Custom-certificate distributions whose MinimumProtocolVersion is older than TLSv1.2_2021 (explicit list, so newer policies such as TLSv1.2_2025/TLSv1.3_2025 pass). Medium when TLS 1.0/1.1 or SSLv3 remain, Low for TLSv1.2_2018/2019. Default-certificate distributions cannot set a policy and are CloudFront.7's."
    severity: medium
  - id: "CloudFront.16"
    title: "CloudFront Lambda URL origins use OAC"
    service: cloudfront
    status: covered
    check_ids: [aws-cloudfront-lambda-url-origin-no-oac]
    reason: "Origins on *.lambda-url.<region>.on.aws without OriginAccessControlId."
    severity: medium
  - id: "CloudFront.17"
    title: "CloudFront signed URLs use trusted key groups"
    service: cloudfront
    status: covered
    check_ids: [aws-cloudfront-legacy-trusted-signers]
    reason: "Any cache behaviour with TrustedSigners.Enabled = true (root CloudFront key pairs) instead of trusted key groups."
    severity: medium
  - id: "CloudTrail.1"
    title: "Multi-Region trail logging read and write management events"
    service: cloudtrail
    status: covered
    check_ids: [aws-cloudtrail-no-multiregion-trail, aws-cloudtrail-not-logging]
    reason: "Account-level on aws_account_settings, including an account with no trail: no multi-region trail is logging, or none that is logging records read AND write management events (cloudtrail:GetEventSelectors, basic ReadWriteType All with IncludeManagementEvents, or an advanced Management selector without a readOnly filter and with no other condition; graded Low). Excluded management event sources count as incomplete.."
    severity: high
  - id: "CloudTrail.2"
    title: "CloudTrail logs encrypted with KMS"
    service: cloudtrail
    status: covered
    check_ids: [aws-cloudtrail-no-kms-encryption]
    reason: "KmsKeyId from DescribeTrails stored as `kms_key_id`."
    severity: medium
  - id: "CloudTrail.4"
    title: "CloudTrail log file validation enabled"
    service: cloudtrail
    status: covered
    check_ids: [aws-cloudtrail-no-log-validation]
    severity: low
  - id: "CloudTrail.5"
    title: "Trails deliver to CloudWatch Logs"
    service: cloudtrail
    status: covered
    check_ids: [aws-cloudtrail-no-cloudwatch-logs]
    reason: "`cloudwatch_log_group` is written empty when the trail has none."
    severity: medium
  - id: "CodeBuild.1"
    title: "CodeBuild Bitbucket source URLs hold no credentials"
    service: codebuild
    status: covered
    check_ids: [aws-codebuild-source-url-credentials]
    reason: "codebuild:BatchGetProjects source.location and every secondarySources location; fires on any URL carrying userinfo (user:password@ or token@), Bitbucket and other providers alike. Only source identifiers are stored, never the credential."
    severity: critical
  - id: "CodeBuild.2"
    title: "CodeBuild env vars hold no plaintext credentials"
    service: codebuild
    status: covered
    check_ids: [aws-codebuild-plaintext-aws-credentials]
    reason: "codebuild:BatchGetProjects environment.environmentVariables: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY of type PLAINTEXT (an omitted type is PLAINTEXT). Variable names only are stored."
    severity: critical
  - id: "CodeBuild.3"
    title: "CodeBuild S3 logs encrypted"
    service: codebuild
    status: covered
    check_ids: [aws-codebuild-s3-logs-unencrypted]
    reason: "codebuild:BatchGetProjects logsConfig.s3Logs: status ENABLED with encryptionDisabled=true (omitted = encrypted, the API default)."
    severity: low
  - id: "CodeBuild.4"
    title: "CodeBuild projects configure logging"
    service: codebuild
    status: covered
    check_ids: [aws-codebuild-logging-disabled]
    reason: "codebuild:BatchGetProjects logsConfig: fires only when both cloudWatchLogs and s3Logs report DISABLED."
    severity: medium
  - id: "CodeBuild.7"
    title: "CodeBuild report exports encrypted at rest"
    service: codebuild
    status: covered
    check_ids: [aws-codebuild-report-export-unencrypted]
    reason: "codebuild:ListReportGroups + BatchGetReportGroups exportConfig: S3 export with s3Destination.encryptionDisabled=true. Neither SecurityAudit nor ViewOnlyAccess grants these two reads; the read-only role carries them as a supplemental statement."
    severity: medium
  - id: "Cognito.1"
    title: "Cognito threat protection enforced for standard authentication"
    service: cognito
    status: covered
    check_ids: [aws-cognito-threat-protection-not-enforced]
    reason: "cognito-idp:DescribeUserPool UserPoolAddOns.AdvancedSecurityMode not ENFORCED (OFF when no add-ons). The same per-pool check covers custom authentication (Cognito.4): one finding per pool for either gap."
    severity: medium
  - id: "Cognito.2"
    title: "Cognito identity pools disallow unauthenticated identities"
    service: cognito
    status: covered
    check_ids: [aws-cognito-identity-pool-guest-access]
    reason: "cognito-identity:ListIdentityPools + DescribeIdentityPool AllowUnauthenticatedIdentities=true."
    severity: medium
  - id: "Cognito.3"
    title: "Cognito user pools enforce strong passwords"
    service: cognito
    status: covered
    check_ids: [aws-cognito-weak-password-policy]
    reason: "cognito-idp:DescribeUserPool Policies.PasswordPolicy against the Security Hub defaults: MinimumLength >= 8, all four character classes required, TemporaryPasswordValidityDays <= 7."
    severity: medium
  - id: "Cognito.4"
    title: "Cognito threat protection fully enforced"
    service: cognito
    status: covered
    check_ids: [aws-cognito-threat-protection-not-enforced]
    reason: "cognito-idp:DescribeUserPool UserPoolAddOns: threat protection OFF (no add-ons = never activated), or AdvancedSecurityAdditionalFlows.CustomAuthMode not ENFORCED."
    severity: medium
  - id: "Cognito.5"
    title: "Cognito user pools require MFA"
    service: cognito
    status: covered
    check_ids: [aws-cognito-user-pool-no-mfa]
    reason: "cognito-idp:DescribeUserPool: MfaConfiguration OFF on a pool whose sign-in policy offers PASSWORD as the only first factor (no sign-in policy = PASSWORD only, the API default). OPTIONAL counts as MFA enabled, as in the Config rule."
    severity: medium
  - id: "Cognito.6"
    title: "Cognito user pools have deletion protection"
    service: cognito
    status: covered
    check_ids: [aws-cognito-no-deletion-protection]
    reason: "cognito-idp:DescribeUserPool DeletionProtection=INACTIVE."
    severity: medium
  - id: "Config.1"
    title: "AWS Config enabled with service-linked role"
    service: config
    status: covered
    check_ids: [aws-config-recorder-off, aws-config-not-service-linked-role]
    reason: "Per region on aws_region_settings: a customer recorder that records every supported type, is recording, has a delivery channel and has not last failed (aws-config-recorder-off), and uses AWSServiceRoleForConfig (aws-config-not-service-linked-role, Info). Security Hub's own service-linked recorder is ignored, so an account relying only on it reads as having no recorder."
    severity: critical
  - id: "Connect.2"
    title: "Connect instances log to CloudWatch"
    service: connect
    status: covered
    check_ids: [aws-connect-flow-logs-disabled]
    reason: "connect:ListInstances + ListInstanceAttributes `CONTACTFLOW_LOGS` false on ACTIVE instances (ListInstanceAttributes, not DescribeInstanceAttribute, is what ViewOnlyAccess grants)."
    severity: medium
  - id: "DataFirehose.1"
    title: "Firehose delivery streams encrypted at rest"
    service: datafirehose
    status: covered
    check_ids: [aws-firehose-not-encrypted]
    reason: "firehose:ListDeliveryStreams + DescribeDeliveryStream DeliveryStreamEncryptionConfiguration.Status DISABLED / ENABLING_FAILED (no block = never enabled) on Direct PUT streams. Streams sourced from a Kinesis data stream or MSK store no records themselves (SSE cannot be enabled on them); their data at rest is the source's, graded by Kinesis.1."
    severity: medium
  - id: "DataSync.1"
    title: "DataSync tasks have logging enabled"
    service: datasync
    status: covered
    check_ids: [aws-datasync-task-logging-disabled]
    reason: "datasync:ListTasks + DescribeTask: fires on log level OFF, or a Basic-mode task with no `CloudWatchLogGroupArn` (Enhanced-mode tasks log to /aws/datasync without one)."
    severity: medium
  - id: "DMS.1"
    title: "DMS replication instances not public"
    service: dms
    status: covered
    check_ids: [aws-dms-replication-instance-public]
    reason: "dms:DescribeReplicationInstances PubliclyAccessible. Graded Low as network reachability: the instance holds no client login of its own."
    severity: critical
  - id: "DMS.6"
    title: "DMS instances auto-upgrade minor versions"
    service: dms
    status: covered
    check_ids: [aws-dms-auto-minor-upgrade-disabled]
    reason: "dms:DescribeReplicationInstances AutoMinorVersionUpgrade."
    severity: medium
  - id: "DMS.7"
    title: "DMS target-database task logging enabled"
    service: dms
    status: covered
    check_ids: [aws-dms-task-target-logging-disabled]
    reason: "dms:DescribeReplicationTasks ReplicationTaskSettings: Logging.EnableLogging and TARGET_APPLY + TARGET_LOAD at LOGGER_SEVERITY_DEFAULT, DEBUG or DETAILED_DEBUG; a component missing from LogComponents fails. Unreadable settings stay unknown."
    severity: medium
  - id: "DMS.8"
    title: "DMS source-database task logging enabled"
    service: dms
    status: covered
    check_ids: [aws-dms-task-source-logging-disabled]
    reason: "dms:DescribeReplicationTasks ReplicationTaskSettings: Logging.EnableLogging and SOURCE_CAPTURE + SOURCE_UNLOAD at LOGGER_SEVERITY_DEFAULT or above; a missing component fails."
    severity: medium
  - id: "DMS.9"
    title: "DMS endpoints use SSL"
    service: dms
    status: covered
    check_ids: [aws-dms-endpoint-no-ssl]
