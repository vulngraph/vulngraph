components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: graph_session
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid input.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Not authenticated.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Insufficient role.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicts with existing state.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: Unprocessable entity — request body is well-formed JSON but fails validation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: A backing engine is not available (not configured, or not ready yet).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GatewayTimeout:
      description: An upstream engine did not answer within its deadline.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limited. Retry after the `Retry-After` header (seconds, also in `retry_after_seconds`).
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. `violations` is present on field-level 400s.
      required: [title, status]
      properties:
        type: { type: string, description: URI identifying the problem type. }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, description: Trace ID for this occurrence. }
        err_code: { type: string }
        retry_after_seconds: { type: integer }
        violations:
          type: array
          items: { $ref: '#/components/schemas/FieldViolation' }
    FieldViolation:
      type: object
      required: [field, description]
      properties:
        field: { type: string }
        description: { type: string }
