# LLM usage domain (internal/app/llmusage). The spend ledger behind the monthly
# LLM budgets (ADR 085 §7): every model call from any feature is recorded with
# its tokens and an estimated cost from the configured price table (LLM_PRICES).
# Costs are estimates, never invoices: a call whose provider reported no usage
# is charged its worst case and counted in `unreported_calls`.
components:
  pathItems:
    getLLMUsage:
      get:
        operationId: getLLMUsage
        tags: [llm-usage]
        summary: LLM spend for a calendar month against the monthly budgets (admin)
        parameters:
          - name: month
            in: query
            required: false
            description: Calendar month (UTC) as YYYY-MM. Defaults to the current month.
            schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        responses:
          '200':
            description: The month's usage.
            content:
              application/json:
                schema: { $ref: '#/components/schemas/LLMUsageSummary' }
          '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
          '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
          '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }

  schemas:
    LLMUsageSummary:
      type: object
      required:
        - month
        - since
        - until
        - monthly_budget_usd
        - interactive_budget_usd
        - user_daily_budget_usd
        - user_monthly_budget_usd
        - spent_usd
        - interactive_spent_usd
        - background_spent_usd
        - unrecorded_usd
        - default_price_used_for_models
        - lines
      properties:
        month: { type: string, description: 'The month reported (YYYY-MM).' }
        since: { type: string, format: date-time }
        until: { type: string, format: date-time, description: Exclusive end of the month. }
        monthly_budget_usd:
          type: number
          description: >
            LLM_MONTHLY_BUDGET_USD — the cap on ALL spend this month, which gates
            background work (reasoning, adjudication, CT triage, agents). 0 means unlimited.
        interactive_budget_usd:
          type: number
          description: >
            LLM_INTERACTIVE_MONTHLY_BUDGET_USD — the cap on interactive spend only
            (chat, NL query, refine, template generation). Background spend never
            counts against it. 0 means unlimited.
        user_daily_budget_usd:
          type: number
          description: >
            LLM_USER_DAILY_BUDGET_USD — the cap on one user's interactive spend per
            UTC day. 0 means unlimited.
        user_monthly_budget_usd:
          type: number
          description: >
            LLM_USER_MONTHLY_BUDGET_USD — the cap on one user's interactive spend
            per calendar month. 0 means unlimited.
        spent_usd: { type: number, description: 'Estimated spend this month across every purpose.' }
        interactive_spent_usd: { type: number }
        background_spent_usd: { type: number }
        unrecorded_usd:
          type: number
          description: >
            Spend this process could not write to the ledger. It still counts
            against the budgets; non-zero means the ledger is understating.
        default_price_used_for_models:
          type: array
          items: { type: string }
          description: >
            Models this month that LLM_PRICES does not name, priced at the deliberately
            high fallback. Add them to LLM_PRICES for accurate figures.
        lines:
          type: array
          items: { $ref: '#/components/schemas/LLMUsageLine' }

    LLMUsageLine:
      type: object
      description: One purpose × model row, most expensive first.
      required:
        - purpose
        - model
        - interactive
        - calls
        - unreported_calls
        - failed_calls
        - input_tokens
        - output_tokens
        - cache_read_tokens
        - cache_write_tokens
        - cost_usd
      properties:
        purpose:
          type: string
          description: 'One of chat, nl_query, refine, template_gen, reason, adjudicate, ct_triage.'
        model: { type: string }
        interactive: { type: boolean }
        calls: { type: integer }
        unreported_calls:
          type: integer
          description: Calls whose provider reported no usage; their tokens are the worst-case charge.
        failed_calls: { type: integer }
        input_tokens: { type: integer, description: Uncached input tokens. }
        output_tokens: { type: integer }
        cache_read_tokens: { type: integer }
        cache_write_tokens: { type: integer }
        cost_usd: { type: number }
