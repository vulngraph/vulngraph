  - id: "1.2.1"
    title: "API server rejects anonymous requests"
    service: api-server
    status: covered
    check_ids: [k8s-apiserver-anonymous-auth]
    reason: "Self-managed clusters: read from the kube-apiserver mirror pod's command line in kube-system (kubeadm static pods), with the upstream v1.30 default when the flag is absent; one finding per cluster, firing if any replica fails. Managed control planes publish no mirror pod, so the check stays silent (unknown), and the EKS/GKE matrices own those clusters. A --authentication-config file without the flag is unknown."
    severity: high
