  # ── 8.3 Key Vault ────────────────────────────────────────────────────────
  - id: "8.3.1"
    title: RBAC vault keys have expiry dates
    service: key-vault
    status: covered
    check_ids: [azure-keyvault-rbac-key-no-expiry]
    reason: "ARM vaults/keys list: enabled keys without attributes.exp, on vaults whose enableRbacAuthorization is true."
    severity: medium
  - id: "8.3.2"
    title: Access-policy vault keys have expiry dates
    service: key-vault
    status: covered
    check_ids: [azure-keyvault-policy-key-no-expiry]
    reason: "ARM vaults/keys list: enabled keys without attributes.exp, on access-policy vaults."
    severity: medium
  - id: "8.3.3"
    title: RBAC vault secrets have expiry dates
    service: key-vault
    status: covered
    check_ids: [azure-keyvault-rbac-secret-no-expiry]
    reason: "ARM vaults/secrets list (metadata only, never values): enabled secrets without attributes.exp, RBAC vaults."
    severity: medium
  - id: "8.3.4"
    title: Access-policy vault secrets have expiry dates
    service: key-vault
    status: covered
    check_ids: [azure-keyvault-policy-secret-no-expiry]
    reason: "ARM vaults/secrets list: enabled secrets without attributes.exp, access-policy vaults."
    severity: medium
