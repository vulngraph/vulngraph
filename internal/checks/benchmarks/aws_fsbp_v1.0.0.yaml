    service: s3
    status: covered
    check_ids: [aws-s3-public-write]
    reason: "Same inputs as S3.2, write grants: s3:PutObject/DeleteObject/DeleteObjectVersion/PutObjectAcl/PutObjectVersionAcl/PutBucketPolicy/DeleteBucketPolicy/PutBucketAcl/DeleteBucket to everyone (Principal \"*\", or an Allow with NotPrincipal), or WRITE/WRITE_ACP/FULL_CONTROL in the ACL."
    severity: critical
