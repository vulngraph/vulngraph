  - id: "5.3.1"
    title: "CNI plugin supports NetworkPolicy"
    service: network-policy
    status: covered
    check_ids: [k8s-no-network-policy-engine]
    reason: "network_policy_engines from the Kubernetes API: the VPC CNI network policy controller flag or a Calico, Cilium, Antrea, kube-router, Weave, Azure NPM or GKE Dataplane V2 node agent. Medium on EKS; elsewhere Low, since an enforcer outside that closed list reads as none. GKE steps aside for its own addon checks. CIS marks this Manual: CNI capability is inferred from the running enforcer."
    severity: medium
  - id: "5.3.2"
    title: "Every namespace has a NetworkPolicy"
    service: network-policy
    status: covered
    check_ids: [k8s-namespace-no-network-policy]
    reason: "The control asks that a NetworkPolicy be defined in every namespace; k8s-namespace-no-network-policy reports each Active namespace with none. System namespaces are platform-managed and exempt."
    severity: medium
  - id: "5.4.1"
    title: "Mount secrets as files, not env vars"
    service: secrets
    status: covered
    check_ids: [k8s-pod-secret-in-env]
    reason: "Secret names (never values) from env[].valueFrom.secretKeyRef and envFrom[].secretRef; system namespaces are exempt."
    severity: medium
  - id: "5.4.2"
    title: "Keep secrets in a dedicated secret manager"
    service: secrets
    status: manual
    reason: "An architectural choice; external-secrets/CSI driver presence is a hint only and needs operator judgement."
    severity: low
  - id: "5.5.1"
    title: "Enforce image provenance at admission"
    service: admission-control
    status: covered
    check_ids: [k8s-apiserver-no-image-policy-webhook]
    reason: "Self-managed clusters: read from the kube-apiserver mirror pod's command line in kube-system (kubeadm static pods), with the upstream v1.30 default when the flag is absent; one finding per cluster, firing if any replica fails. Managed control planes publish no mirror pod, so the check stays silent (unknown), and the EKS/GKE matrices own those clusters. The control names ImagePolicyWebhook; an image-verification policy engine (sigstore policy-controller, Kyverno verifyImages) meets the intent but not this control, and is named in the finding."
    severity: medium
