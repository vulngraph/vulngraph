benchmark: cis-kubernetes
name: CIS Kubernetes Benchmark
version: "2.0.1"
family: cis
providers: [kubernetes]
source: https://www.cisecurity.org/benchmark/kubernetes
controls:
  - id: "1.1.1"
    title: "API server manifest file mode 600 or tighter"
    service: control-plane-files
    status: covered
    check_ids: [k8s-cp-apiserver-manifest-file]
    reason: "Needs the opt-in node posture reader (ADR 094; Helm nodePosture.controlPlane): a DaemonSet that stats the file with read-only hostPath mounts and no credentials, read back through pods/log. One finding per cluster, firing when any node fails; mode and ownership of the file are one check. Unknown, never passing, without the reader or when it does not cover every node."
    severity: medium
