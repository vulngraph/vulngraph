    title: "S3 buckets have Block Public Access"
    service: s3
    status: covered
    check_ids: [aws-s3-public-bucket, aws-s3-public-read, aws-s3-public-write, aws-s3-bucket-bpa-incomplete]
    reason: "The bucket's OWN four flags: when the effective block (bucket + account) is incomplete aws-s3-public-bucket fires (or the public read/write check it steps aside for — both imply an incomplete block); when the account block covers the bucket but its own flags are incomplete, aws-s3-bucket-bpa-incomplete fires (Low: not exposed today)."
